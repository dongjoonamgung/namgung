const IC={'생활비':'🏠','배달':'🛵','외식':'🍽️','편의점':'🏪','카페·간식':'☕','쇼핑':'🛍️','차량·교통':'🚗','통신·구독':'📱','보험':'🛡️','의료':'💊','육아':'🧸','여가·여행':'✈️','미용·생활':'✂️','송금':'💸','간편결제':'💳','이자':'🏦','기타':'📦','급여':'💼','육아수당':'👶','가족':'👪','환불':'↩️','기타 수입':'💰'};
const CC={'생활비':'#6366f1','배달':'#f97316','외식':'#ef4444','편의점':'#eab308','카페·간식':'#a16207','쇼핑':'#ec4899','차량·교통':'#0ea5e9','통신·구독':'#8b5cf6','보험':'#14b8a6','의료':'#22c55e','육아':'#f472b6','여가·여행':'#06b6d4','미용·생활':'#84cc16','송금':'#64748b','간편결제':'#94a3b8','이자':'#475569','기타':'#cbd5e1'};
const W=n=>{n=Math.round(n);const a=Math.abs(n),s=n<0?'-':'';if(a>=1e8)return s+(a/1e8).toFixed(1)+'억';if(a>=1e4)return s+(a>=1e6?Math.round(a/1e4):(a/1e4).toFixed(1).replace(/\.0$/,''))+'만';return s+a.toLocaleString()};
const F=n=>Math.round(n).toLocaleString()+'원';
const DOW='일월화수목금토';
let D,M,TAB=0,TF='all',CF=null,SEL=null;
const mt=m=>D.T.filter(x=>x.d.startsWith(m));
const sum=(a,io)=>a.filter(x=>x.io==io).reduce((s,x)=>s+x.a,0);
const byCat=(a,io='out')=>{const g={};a.filter(x=>x.io==io).forEach(x=>g[x.c]=(g[x.c]||0)+x.a);return Object.entries(g).sort((a,b)=>b[1]-a[1])};
const pm=m=>{let[y,mm]=m.split('-').map(Number);mm--;if(!mm){y--;mm=12}return y+'-'+String(mm).padStart(2,'0')};
const nm=m=>{let[y,mm]=m.split('-').map(Number);mm++;if(mm>12){y++;mm=1}return y+'-'+String(mm).padStart(2,'0')};
const CUR=()=>D.today.slice(0,7),DAY=()=>+D.today.slice(8);
const dim=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const MONTHS=()=>{const s=new Set(D.T.map(x=>x.d.slice(0,7)));return [...s].sort().filter(m=>m>='2025-12')};
const ico=(c,sz)=>`<span class="ic" style="background:${(CC[c]||'#94a3b8')}22;${sz?`width:${sz}px;height:${sz}px;font-size:${sz*.5}px`:''}">${IC[c]||'•'}</span>`;
const dday=d=>{const n=Math.round((new Date(d)-new Date(D.today))/864e5);return n==0?'오늘':'D-'+n};
function proj(){const m=CUR(),a=mt(m),S=sum(a,'out'),fd=a.filter(x=>x.io=='out'&&x.f).reduce((s,x)=>s+x.a,0),lf=a.filter(x=>x.c=='생활비').reduce((s,x)=>s+x.a,0),fl=D.fix.filter(r=>!r.yr&&r.nx.startsWith(m)).reduce((s,r)=>s+r.la,0),v=S-fd-lf;return {S,P:Math.round(fd+fl+lf+v/DAY()*dim(m)),fl}}
function samePeriod(m,day){return mt(m).filter(x=>x.io=='out'&&+x.d.slice(8)<=day).reduce((s,x)=>s+x.a,0)}
function row(x){return `<div class="tx">${ico(x.c)}<div class="tm"><div class="tn">${x.m}</div><div class="ts">${x.c} · ${x.s}${x.t?' · '+x.t:''}</div></div><div class="ta ${x.io}">${x.io=='in'?'+':'-'}${x.a.toLocaleString()}</div></div>`}
function grouped(a){const g={};a.forEach(x=>(g[x.d]=g[x.d]||[]).push(x));return Object.entries(g).map(([d,xs])=>{const o=sum(xs,'out'),i=sum(xs,'in'),dt=new Date(d);return `<div class="dh"><span>${+d.slice(5,7)}월 ${+d.slice(8)}일 ${DOW[dt.getDay()]}요일</span><span>${i?`<b class="in">+${W(i)}</b> `:''}${o?`<b>-${W(o)}</b>`:''}</span></div><div class="card nopad">${xs.map(row).join('')}</div>`}).join('')||'<p class="empty">내역이 없어</p>'}
function nav(){const ms=MONTHS();return `<div class="mnav"><button ${M<=ms[0]?'disabled':''} onclick="M=pm(M);draw()">‹</button><b>${M.slice(0,4)}년 ${+M.slice(5)}월</b><button ${M>=CUR()?'disabled':''} onclick="M=nm(M);draw()">›</button></div>`}
function home(){const a=mt(M),O=sum(a,'out'),I=sum(a,'in'),cur=M==CUR(),P=pm(M),pO=sum(mt(P),'out');let h=nav();
h+=`<div class="hero"><div class="hl">${+M.slice(5)}월에 쓴 돈</div><div class="hv">${F(O)}</div><div class="hs">들어온 돈 <b>${F(I)}</b></div>`;

const IC={'생활비':'🏠','배달':'🛵','외식':'🍽️','편의점':'🏪','카페·간식':'☕','쇼핑':'🛍️','차량·교통':'🚗','통신·구독':'📱','보험':'🛡️','의료':'💊','육아':'🧸','여가·여행':'✈️','미용·생활':'✂️','송금':'💸','간편결제':'💳','이자':'🏦','기타':'📦','급여':'💼','육아수당':'👶','가족':'👪','환불':'↩️','기타 수입':'💰'};
const CC={'생활비':'#6366f1','배달':'#f97316','외식':'#ef4444','편의점':'#eab308','카페·간식':'#a16207','쇼핑':'#ec4899','차량·교통':'#0ea5e9','통신·구독':'#8b5cf6','보험':'#14b8a6','의료':'#22c55e','육아':'#f472b6','여가·여행':'#06b6d4','미용·생활':'#84cc16','송금':'#64748b','간편결제':'#94a3b8','이자':'#475569','기타':'#cbd5e1'};
const W=n=>{n=Math.round(n);const a=Math.abs(n),s=n<0?'-':'';if(a>=1e8)return s+(a/1e8).toFixed(1)+'억';if(a>=1e4)return s+(a>=1e6?Math.round(a/1e4):(a/1e4).toFixed(1).replace(/\.0$/,''))+'만';return s+a.toLocaleString()};
const F=n=>Math.round(n).toLocaleString()+'원';
const DOW='일월화수목금토';
let D,M,TAB=0,TF='all',CF=null,SEL=null;
const mt=m=>D.T.filter(x=>x.d.startsWith(m));
const LV=x=>x.c=='생활비';const sum=(a,io)=>a.filter(x=>x.io==io&&!LV(x)).reduce((s,x)=>s+x.a,0);
const mtB=m=>D.T.filter(x=>x.bm==m);
function bud(m){const a=mtB(m),I=a.filter(x=>x.io=='in').reduce((s,x)=>s+x.a,0),L=a.filter(LV).reduce((s,x)=>s+x.a,0);let X=0,xn=[];if(m==CUR()){if(!a.some(x=>x.c=='급여')){const p=mtB(pm(m)).filter(x=>x.c=='급여').reduce((s,x)=>s+x.a,0);if(p){X+=p;xn.push('급여')}}if(!a.some(x=>x.c=='육아수당')){const p=mtB(pm(m)).filter(x=>x.c=='육아수당').reduce((s,x)=>s+x.a,0);if(p){X+=p;xn.push('육아수당')}}}return {I,L,X,xn,A:I+X-L}}
const byCat=(a,io='out')=>{const g={};a.filter(x=>x.io==io&&!LV(x)).forEach(x=>g[x.c]=(g[x.c]||0)+x.a);return Object.entries(g).sort((a,b)=>b[1]-a[1])};
const pm=m=>{let[y,mm]=m.split('-').map(Number);mm--;if(!mm){y--;mm=12}return y+'-'+String(mm).padStart(2,'0')};
const nm=m=>{let[y,mm]=m.split('-').map(Number);mm++;if(mm>12){y++;mm=1}return y+'-'+String(mm).padStart(2,'0')};
const CUR=()=>D.today.slice(0,7),DAY=()=>+D.today.slice(8);
const dim=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const MONTHS=()=>{const s=new Set(D.T.map(x=>x.d.slice(0,7)));return [...s].sort().filter(m=>m>='2025-12')};
const ico=(c,sz)=>`<span class="ic" style="background:${(CC[c]||'#94a3b8')}22;${sz?`width:${sz}px;height:${sz}px;font-size:${sz*.5}px`:''}">${IC[c]||'•'}</span>`;
const dday=d=>{const n=Math.round((new Date(d)-new Date(D.today))/864e5);return n==0?'오늘':'D-'+n};
function proj(){const m=CUR(),a=mt(m),S=sum(a,'out'),fd=a.filter(x=>x.io=='out'&&x.f).reduce((s,x)=>s+x.a,0),fl=D.fix.filter(r=>!r.yr&&r.nx.startsWith(m)).reduce((s,r)=>s+r.la,0),v=S-fd;return {S,P:Math.round(fd+fl+v/DAY()*dim(m)),fl}}
function samePeriod(m,day){return mt(m).filter(x=>x.io=='out'&&!LV(x)&&+x.d.slice(8)<=day).reduce((s,x)=>s+x.a,0)}
function row(x){const bt=x.bm!=x.d.slice(0,7)?` <span class="tag">${+x.bm.slice(5)}월 몫</span>`:'';return `<div class="tx ${LV(x)?'lv':''}">${ico(x.c)}<div class="tm"><div class="tn">${x.m}${bt}</div><div class="ts">${x.c}${LV(x)?' (쓴 돈에서 제외)':''} · ${x.s}${x.t?' · '+x.t:''}</div></div><div class="ta ${LV(x)?'lvA':x.io}">${x.io=='in'?'+':'-'}${x.a.toLocaleString()}</div></div>`}
function grouped(a){const g={};a.forEach(x=>(g[x.d]=g[x.d]||[]).push(x));return Object.entries(g).map(([d,xs])=>{const o=sum(xs,'out'),i=sum(xs,'in'),dt=new Date(d);return `<div class="dh"><span>${+d.slice(5,7)}월 ${+d.slice(8)}일 ${DOW[dt.getDay()]}요일</span><span>${i?`<b class="in">+${W(i)}</b> `:''}${o?`<b>-${W(o)}</b>`:''}</span></div><div class="card nopad">${xs.map(row).join('')}</div>`}).join('')||'<p class="empty">내역이 없어</p>'}
function nav(){const ms=MONTHS();return `<div class="mnav"><button ${M<=ms[0]?'disabled':''} onclick="M=pm(M);draw()">‹</button><b>${M.slice(0,4)}년 ${+M.slice(5)}월</b><button ${M>=CUR()?'disabled':''} onclick="M=nm(M);draw()">›</button></div>`}
function home(){const a=mt(M),O=sum(a,'out'),I=sum(a,'in'),cur=M==CUR(),P=pm(M),pO=sum(mt(P),'out');let h=nav();
const B=bud(M),rem=B.A-O,rt=B.A>0?Math.min(100,O/B.A*100):100;
h+=`<div class="hero"><div class="hl">${+M.slice(5)}월에 쓸 수 있는 돈</div><div class="hv">${F(B.A)}</div><div class="hs">들어온 돈 ${W(B.I)}${B.X?` + ${B.xn.join('·')} 예정 ${W(B.X)}`:''} − 생활비 ${W(B.L)}</div>
<div class="bud"><div class="bl"><span>쓴 돈 <b>${F(O)}</b></span><span class="${rem<0?'neg':'pos'}"><b>${rem<0?W(-rem)+'원 넘었어':W(rem)+'원 남았어'}</b></span></div><div class="gb big"><div style="width:${rt}%;background:${rem<0?'#f04452':rt>80?'#f59e0b':'#3182f6'}"></div></div></div>`;
if(cur){const p=proj(),sp=samePeriod(P,DAY()),d=O-sp,pr=B.A-p.P;
h+=`<div class="hs" style="margin-top:12px">이대로면 말일까지 <b>${W(p.P)}원</b> 써서, 쓸 수 있는 돈보다 <b class="${pr<0?'neg':'pos'}">${W(Math.abs(pr))}원 ${pr<0?'모자라':'남아'}</b></div>
<div class="pill ${d>0?'up':'down'}">지난달 같은 기간보다 ${W(Math.abs(d))}원 ${d>0?'더 썼어 ▲':'덜 썼어 ▼'} · 지난달 전체 ${W(pO)}</div>`}
else h+=`<div class="hs" style="margin-top:12px">지난달보다 <b class="${O>pO?'neg':'pos'}">${W(Math.abs(O-pO))}원 ${O>pO?'더':'덜'}</b> 썼어</div>`;
h+=`</div>`;
if(cur){const t=D.T.filter(x=>x.d==D.today),wk=new Date(D.today);wk.setDate(wk.getDate()-((wk.getDay()+6)%7));const ws=wk.toISOString().slice(0,10),w=D.T.filter(x=>x.d>=ws&&x.d<=D.today);
h+=`<div class="two"><div class="card sm" onclick="TAB=1;SEL=D.today;draw()"><div class="sl">오늘</div><div class="sv">-${W(sum(t,'out'))}</div><div class="ss">${t.filter(x=>x.io=='out').length}건</div></div><div class="card sm" onclick="TAB=2;draw()"><div class="sl">이번 주</div><div class="sv">-${W(sum(w,'out'))}</div><div class="ss">${+ws.slice(5,7)}/${+ws.slice(8)}부터 · ${w.filter(x=>x.io=='out').length}건</div></div></div>`}
const pc=Object.fromEntries(byCat(mt(P)));const cats=byCat(a).slice(0,6);
h+=`<div class="card"><div class="ch"><b>어디에 많이 썼나</b><a onclick="TAB=3;draw()">전체 ›</a></div>${cats.map(([c,v])=>{const d=v-(pc[c]||0);return `<div class="cr">${ico(c)}<div class="cm"><div class="cn">${c}<span class="pct">${Math.round(v/O*100)}%</span></div><div class="cb"><div style="width:${v/cats[0][1]*100}%;background:${CC[c]||'#94a3b8'}"></div></div></div><div class="cv">${W(v)}<div class="cd ${d>0?'neg':'pos'}">${d>0?'▲':'▼'} ${W(Math.abs(d))}</div></div></div>`}).join('')}</div>`;
if(cur){h+=goalsCard(true);const up=[...D.fix].sort((a,b)=>a.nx<b.nx?-1:1).slice(0,4);h+=`<div class="card"><div class="ch"><b>곧 빠져나갈 돈</b><a onclick="TAB=4;draw()">고정비 ›</a></div>${up.map(r=>`<div class="cr">${ico(r.c)}<div class="cm"><div class="cn">${r.n}</div><div class="ts">${+r.nx.slice(5,7)}/${+r.nx.slice(8)} · ${r.s}</div></div><div class="cv">${W(r.la)}<div class="dd">${dday(r.nx)}</div></div></div>`).join('')}</div>`}
return h}
function goalsCard(mini){const m=CUR(),c=Object.fromEntries(byCat(mt(m)));return `<div class="card"><div class="ch"><b>이번 달 절약 목표</b>${mini?'<a onclick="TAB=4;draw()">자세히 ›</a>':''}</div>${D.goals.map(([g,b])=>{const v=c[g]||0,p=v/DAY()*dim(m),r=Math.min(100,v/b*100);return `<div class="gr">${ico(g)}<div class="cm"><div class="cn">${g}<span class="ts">${W(v)} / ${W(b)}</span></div><div class="gb"><div style="width:${r}%;background:${r>=100?'#ef4444':p>b?'#f59e0b':'#22c55e'}"></div></div><div class="ts">${r>=100?`목표 넘었어 (${W(v-b)} 초과)`:`${W(b-v)} 남았어`} · 이 속도면 말일 ${W(p)}</div></div></div>`}).join('')}</div>`}
function cal(){const a=mt(M),first=new Date(M+'-01'),n=dim(M);let h=nav();const by={};a.filter(x=>!LV(x)).forEach(x=>{const k=+x.d.slice(8);by[k]=by[k]||{o:0,i:0};by[k][x.io=='out'?'o':'i']+=x.a});
const mx=Math.max(1,...Object.values(by).map(v=>v.o).sort((a,b)=>a-b).slice(0,-2));
if(!SEL||!SEL.startsWith(M))SEL=M==CUR()?D.today:null;
h+=`<div class="card"><div class="msum"><span>쓴 돈 <b class="neg">${F(sum(a,'out'))}</b></span><span>쓸 수 있는 돈 <b class="in">${F(bud(M).A)}</b></span></div><div class="cal">${[...DOW].map((d,i)=>`<div class="cw ${i==0?'sun':i==6?'sat':''}">${d}</div>`).join('')}${'<div></div>'.repeat(first.getDay())}`;
for(let d=1;d<=n;d++){const k=M+'-'+String(d).padStart(2,'0'),v=by[d]||{o:0,i:0},fut=k>D.today;const al=Math.min(1,v.o/mx);h+=`<div class="cd2 ${SEL==k?'sel':''} ${k==D.today?'tod':''} ${fut?'fut':''}" onclick="SEL='${k}';draw()" style="${v.o?`background:rgba(239,68,68,${.06+al*.28})`:''}"><div class="cdn">${d}</div>${v.i?`<div class="ci">+${W(v.i)}</div>`:''}${v.o?`<div class="co">-${W(v.o)}</div>`:''}</div>`}
h+=`</div></div>`;if(SEL){h+=grouped(D.T.filter(x=>x.d==SEL))}return h}
function list(){const a=mt(M);let h=nav();const cats=byCat(a,TF=='in'?'in':'out').map(x=>x[0]);
h+=`<div class="chips">${[['all','전체'],['out','지출'],['in','수입']].map(([k,l])=>`<button class="${TF==k?'on':''}" onclick="TF='${k}';CF=null;draw()">${l}</button>`).join('')}</div>`;
if(TF!='all')h+=`<div class="chips sc">${cats.map(c=>`<button class="${CF==c?'on':''}" onclick="CF=CF=='${c}'?null:'${c}';draw()">${IC[c]||''} ${c}</button>`).join('')}</div>`;
let f=a.filter(x=>TF=='all'||x.io==TF).filter(x=>!CF||x.c==CF);if(CF)h+=`<div class="fsum">${IC[CF]||''} ${CF} 합계 <b>${F(f.reduce((s,x)=>s+x.a,0))}</b> · ${f.length}건</div>`;return h+grouped(f)}
function donut(cs,tot){let a0=-Math.PI/2,s='';const R=70,r=46;cs.forEach(([c,v])=>{const a1=a0+v/tot*Math.PI*2,lg=a1-a0>Math.PI?1:0,p=(a,rr)=>[100+rr*Math.cos(a),100+rr*Math.sin(a)];const[x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[x2,y2]=p(a1,r),[x3,y3]=p(a0,r);s+=`<path d="M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z" fill="${CC[c]||'#94a3b8'}"/>`;a0=a1});return `<svg viewBox="0 0 200 200" class="donut">${s}<text x="100" y="94" text-anchor="middle" font-size="11" fill="#888">총 지출</text><text x="100" y="114" text-anchor="middle" font-size="17" font-weight="700">${W(tot)}</text></svg>`}
function anal(){const a=mt(M),O=sum(a,'out'),cs=byCat(a),pc=Object.fromEntries(byCat(mt(pm(M))));let h=nav();
h+=`<div class="card"><div class="ch"><b>카테고리별 지출</b></div>${donut(cs,O)}${cs.map(([c,v])=>{const d=v-(pc[c]||0);return `<div class="cr" onclick="TAB=2;TF='out';CF='${c}';draw()">${ico(c)}<div class="cm"><div class="cn">${c}</div><div class="ts">${Math.round(v/O*100)}% · 지난달 ${W(pc[c]||0)}</div></div><div class="cv">${W(v)}<div class="cd ${d>0?'neg':'pos'}">${d>0?'▲':'▼'} ${W(Math.abs(d))}</div></div></div>`}).join('')}</div>`;
const ms=MONTHS(),S=ms.map(m=>({m,o:sum(mt(m),'out'),i:Math.max(0,bud(m).A)})),mx=Math.max(...S.map(s=>Math.max(s.o,s.i)));
h+=`<div class="card"><div class="ch"><b>월별 쓸 수 있는 돈·쓴 돈</b><span class="ts">막대를 누르면 그 달로 이동</span></div><div class="mb">${S.map(s=>`<div class="mc ${s.m==M?'on':''}" onclick="M='${s.m}';draw()"><div class="mbs"><div class="bi" style="height:${s.i/mx*100}%"></div><div class="bo" style="height:${s.o/mx*100}%"></div></div><div class="ml">${+s.m.slice(5)}월</div><div class="mn ${s.i-s.o<0?'neg':'pos'}">${W(s.i-s.o)}</div></div>`).join('')}</div><div class="lg"><span><i style="background:#93c5fd"></i>쓸 수 있는 돈</span><span><i style="background:#fb923c"></i>쓴 돈</span><span>아래 숫자는 남은 돈</span></div></div>`;
const B=ms.map(m=>({m,v:-(((D.kbal[m]??null)||0)+((D.hbal[m]??null)||0))}));let lk=0,lh=0;const B2=ms.map(m=>{if(D.kbal[m]!=null)lk=D.kbal[m];if(D.hbal[m]!=null)lh=D.hbal[m];return {m,v:-(lk+lh)}});const bm=Math.max(1,...B2.map(b=>b.v));
h+=`<div class="card"><div class="ch"><b>마이너스 통장 빚 (월말)</b><span class="neg">지금 ${W(B2.at(-1).v)}</span></div><svg viewBox="0 0 ${B2.length*40} 110" class="ln"><polyline fill="none" stroke="#ef4444" stroke-width="2.5" points="${B2.map((b,i)=>`${i*40+20},${95-Math.max(0,b.v)/bm*80}`).join(' ')}"/>${B2.map((b,i)=>`<circle cx="${i*40+20}" cy="${95-Math.max(0,b.v)/bm*80}" r="3" fill="#ef4444"/><text x="${i*40+20}" y="108" font-size="9" text-anchor="middle" fill="#888">${+b.m.slice(5)}월</text>`).join('')}</svg><div class="ts">국민 ${W(-lk)} · 하나 ${W(-lh)}. 내려갈수록 좋아.</div></div>`;return h}
function fixT(){const tot=D.fix.reduce((s,r)=>s+r.mo,0);let h=`<div class="hero"><div class="hl">숨만 쉬어도 매달 나가는 돈</div><div class="hv">${F(tot)}</div><div class="hs">1년이면 <b>${W(tot*12)}원</b></div></div>`;
h+=`<div class="card nopad">${[...D.fix].sort((a,b)=>a.nx<b.nx?-1:1).map(r=>`<div class="tx">${ico(r.c)}<div class="tm"><div class="tn">${r.n}${r.yr?' <span class="tag">1년에 한 번</span>':''}</div><div class="ts">${r.s} · 다음 ${+r.nx.slice(5,7)}/${+r.nx.slice(8)} (${dday(r.nx)})</div></div><div class="ta out">${r.yr?W(r.la):W(r.mo)}<div class="ts">${r.yr?'연':'월'}</div></div></div>`).join('')}</div>`;
h+=goalsCard(false)+`<div class="card"><div class="ch"><b>더 줄일 수 있는 곳</b></div><div class="tip">📱 KT를 알뜰폰으로 바꾸면 매달 3~5만 원 아낄 수 있어</div><div class="tip">🔁 구글플레이·Apple·Google Workspace·쿠팡 와우 중 겹치는 구독 정리하면 2~4만 원</div><div class="tip">💳 이자 붙는 할부는 피하기</div><div class="tip">🏦 하나 마이너스부터 갚으면 이자가 줄어</div></div>`;return h}
const TABS=[['🏠','홈',home],['📅','달력',cal],['🧾','내역',list],['📊','분석',anal],['📌','고정비',fixT]];
function draw(){document.getElementById('body').innerHTML=TABS[TAB][2]();document.getElementById('tb').innerHTML=TABS.map((t,i)=>`<button class="${i==TAB?'on':''}" onclick="TAB=${i};draw();scrollTo(0,0)"><span>${t[0]}</span>${t[1]}</button>`).join('')}
function render(){document.getElementById('lock').style.display='none';const a=document.getElementById('app');a.style.display='';a.innerHTML=`<div class="top"><b>가계부</b><span class="ts">${+D.today.slice(5,7)}/${+D.today.slice(8)} 기준 · 국민·하나·국민카드</span></div><div id="body"></div><nav id="tb"></nav>`;D.T.forEach(x=>{x.bm=((x.c=='급여'||LV(x))&&+x.d.slice(8)>=27)?nm(x.d.slice(0,7)):x.d.slice(0,7)});M=CUR();draw()}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function go(){const pw=document.getElementById('pw').value;try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},key,b64(E.c));D=JSON.parse(new TextDecoder().decode(p));sessionStorage.setItem('k',pw);render()}catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않아요'}}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key=='Enter')go()});
if(sessionStorage.getItem('k')){document.getElementById('pw').value=sessionStorage.getItem('k');go()}
</script></body></html>

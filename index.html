function pb(v,t,nu){if(!t&&!v)return '<span class="ts">-</span>';const r=t?Math.min(100,v/t*100):100,o=v>t&&!nu;return `<div class="pg"><div class="gb"><div style="width:${r}%;background:${o?'#c2410c':'#3d566e'}"></div></div><span class="ts ${o?'neg':''}">${W(v)}</span></div>`}

function txAsOf(){let d=D.today||'';(D.T||[]).forEach(x=>{if(x.d&&x.d>d)d=x.d});return d}
function txAsOfLab(){const d=txAsOf();return d?`거래 반영: ~${+d.slice(5,7)}/${+d.slice(8)}`:''}
function NTODAY(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function nadd(d,k){const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+k);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function NPS(){return (D.nut&&D.nut.products)||[]}
function NPAL(i){return ['#1f2d3d','#5b7c99','#f2541b','#7f9bb5','#c2410c','#3d566e'][i%6]}
async function saveNL(){try{if(!KEY)return;const iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify({log:NL,st:ST})));localStorage.setItem('nut',JSON.stringify({i:u64(iv),c:u64(new Uint8Array(c))}))}catch(e){}}
async function loadNL(){let loc={};try{const v=JSON.parse(localStorage.getItem('nut')||'null');if(v&&KEY){const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(v.i)},KEY,b64(v.c));loc=JSON.parse(new TextDecoder().decode(p))||{}}}catch(e){loc={}}let locLog=loc,locSt={};if(isNutWrap(loc)){locLog=loc.log||{};locSt=loc.st||{}}const base=((D.nut&&D.nut.log)?JSON.parse(JSON.stringify(D.nut.log)):{})||{};NL=base;for(const d in locLog)NL[d]=Object.assign({},NL[d]||{},locLog[d]);const baseSt=JSON.parse(JSON.stringify(D.st||{}));ST=baseSt;for(const d in locSt)ST[d]=Object.assign({},ST[d]||{},locSt[d])}
function nTimes(p){if(p&&+p.times>0)return +p.times;const s=String((p&&(p.per||p.dose))||''),m=s.match(/1일\s*(\d+)/)||s.match(/(\d+)\s*(정|캡슐|병)/);return m?+m[1]:1}
function nVal(st,n){n=n||1;if(st=='skip')return {k:0,skip:true,done:false};if(st=='took')return {k:n,skip:false,done:true};if(typeof st=='string'&&st.includes('/'))st=+st.split('/')[0];const v=+st;if(st!=null&&st!==''&&!isNaN(v)&&v>0){const k=Math.min(n,Math.round(v));return {k,skip:false,done:k>=n}}return {k:0,skip:false,done:false}}
async function writeNut(d,id,st){if(d>NTODAY())return;if(!NL[d])NL[d]={};if(st==null||st==='')delete NL[d][id];else NL[d][id]=st;if(!Object.keys(NL[d]).length)delete NL[d];await saveNL();draw()}
async function bumpNut(d,id){const p=NPS().find(x=>x.id==id);if(!p)return;const n=nTimes(p),v=nVal((NL[d]||{})[id],n),next=v.skip?1:v.k>=n?0:v.k+1;if(next===0)clearSt(d,id);else if(v.skip||next>v.k)setStSlot(d,id,next-1,nowSlot(d));await writeNut(d,id,next===0?null:next)}
async function skipNut(d,id){const cur=(NL[d]||{})[id];if(cur!='skip')clearSt(d,id);await writeNut(d,id,cur=='skip'?null:'skip')}
async function setNut(d,id,st){if(st=='skip')return skipNut(d,id);if(st=='took'||st=='bump')return bumpNut(d,id);return writeNut(d,id,st)}
function expNL(){const t='[영양제 기록]\n'+JSON.stringify({log:NL,st:ST},null,2);navigator.clipboard.writeText(t).then(()=>alert('복사했어. 마속 채팅에 붙여 넣으면 원본 데이터에 반영해 둘게.'),()=>prompt('아래 내용을 복사해서 보내 줘',t))}
function nfmt(k,v){const u=((D.nut.unit||{})[k]||'').replace(' RAE','').replace(' α-TE','').replace(' NE',''),n=v==null?0:v,s=(Math.abs(n)>=10||n===0?Math.round(n):Math.round(n*10)/10).toLocaleString();let t=s+u;if(k=='비타민D')t+=` (${Math.round(n*40)}IU)`;return t}
function nutGroups(){const N=D.nut||{},seen=new Set();const groups=(N.groups||[]).map(([g,ks])=>{ks.forEach(k=>seen.add(k));return [g,ks.slice()]});const extra=[];NPS().forEach(p=>Object.keys(p.nuts||{}).forEach(k=>{if(!seen.has(k)){extra.push(k);seen.add(k)}}));Object.keys(N.ref||{}).forEach(k=>{if(!seen.has(k)){extra.push(k);seen.add(k)}});if(extra.length){const i=groups.findIndex(g=>g[0]=='기타');if(i>=0)groups[i][1]=groups[i][1].concat(extra);else groups.push(['기타',extra])}return groups}
function nutDay(d){const ps=NPS(),rec=NL[d]||{};let tk=0,sk=0,miss=0,partN=0,tkD=0,exD=0;ps.forEach(p=>{const n=nTimes(p),v=nVal(rec[p.id],n);exD+=n;tkD+=v.k;if(v.skip)sk++;else if(v.done)tk++;else if(v.k>0)partN++;else miss++});return {tk,sk,miss,partN,n:ps.length,tkD,exD,rec,all:ps.length>0&&tk==ps.length,part:(tk>0||partN>0)&&tk<ps.length,none:sk>0&&tk==0&&partN==0&&miss==0,empty:tkD==0&&sk==0}}
function nutStreak(){const t=NTODAY();let d=t,s=0;if(nutDay(t).empty)d=nadd(t,-1);while(d>='2020-01-01'){const x=nutDay(d);if(!x.all)break;s++;d=nadd(d,-1)}return s}
function nutStart(){const ks=[...Object.keys((D.nut&&D.nut.log)||{}),...Object.keys(NL||{})].filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();return ks[0]||''}
function nutRate(m){const t=NTODAY(),n=dim(m),start=nutStart();if(!start)return {p:0,tk:0,ex:0};let tk=0,ex=0;for(let i=1;i<=n;i++){const d=m+'-'+String(i).padStart(2,'0');if(d<start||d>t)continue;const x=nutDay(d);if(d==t&&x.empty)continue;tk+=x.tkD;ex+=x.exD}return {p:ex?Math.round(tk/ex*100):0,tk,ex}}
function nutPct(k,tot){const r=(D.nut.ref||{})[k];return r?tot/r*100:0}

function nutRing(pct,done){const p=Math.max(0,Math.min(100,Math.round(pct)));return `<div class="nring${done?' done':''}"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="none" stroke="#eef0f3" stroke-width="8"/><circle class="nring-fg" cx="40" cy="40" r="34" fill="none" stroke="#1f2d3d" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 100" transform="rotate(-90 40 40)"/></svg><div class="nring-lab">${done?'<span class="nchk">✓</span>':''}${p}%</div></div>`}
function nutWeek(){const t=NTODAY();let h='<div class="nweek">';for(let i=6;i>=0;i--){const ds=nadd(t,-i),x=nutDay(ds),dow=DOW[new Date(ds+'T12:00:00').getDay()],cls=x.all?'all':x.part?'part':x.none?'none':'empty',lab=x.all?'전부 먹음':x.part?`${x.tkD}/${x.exD}회`:x.none?'스킵':'기록 없음';h+=`<button type="button" class="nwd ${cls}${ds==ND?' sel':''}${ds==t?' today':''}" onclick="ND='${ds}';draw()" title="${+ds.slice(5,7)}/${+ds.slice(8)} · ${lab}"><span>${dow}</span><i></i></button>`}return h+'</div>'}
function nutStepper(p,d){const n=nTimes(p),v=nVal((NL[d]||{})[p.id],n),pips=Array.from({length:n},(_,i)=>`<i class="npip${i<v.k?' on':''}"></i>`).join('');return `<button type="button" class="nstep${v.done?' on took':''}${v.skip?' dim':''}" onclick="bumpNut('${d}','${p.id}')" aria-label="${esc(p.short||p.name)} ${v.k}/${n}">${pips}<span class="nstep-lab">${v.skip?'—':v.k+'/'+n}${v.done?' ✓':''}</span></button>`}
function nutri(){if(!ND||ND>NTODAY())ND=NTODAY();const ps=NPS(),td=NTODAY(),isT=ND==td,x=nutDay(ND),mm=ND.slice(0,7),rt=nutRate(mm),st=nutStreak(),pct=x.exD?x.tkD/x.exD*100:0;
const times=[...new Set(ps.map(p=>p.timing||'기타'))];
const order=['아침 식후','아침·오후','점심 식전','점심 식후','저녁 식후','취침 전'];
times.sort((a,b)=>(order.indexOf(a)+99)-(order.indexOf(b)+99));
const rows=times.map(tm=>{
  const items=ps.filter(p=>(p.timing||'기타')==tm).map(p=>{
    const v=nVal((NL[ND]||{})[p.id],nTimes(p)),until=p.until?`<div class="ts">소비기한 ${p.until.slice(0,4)}.${p.until.slice(5,7)}.${p.until.slice(8)}</div>`:'';
    return `<div class="nr"><div class="nri"><b>${esc(p.name)}</b><div class="ts">${esc(p.per||p.dose||'')}${v.done?' · 완료':v.k&&nTimes(p)>1?` · ${v.k}/${nTimes(p)}`:''}</div>${until}${v.skip?'':stChips(ND,p.id,v.k)}</div><div class="nrb">${nutStepper(p,ND)}<button type="button" class="nskip${v.skip?' on skip':''}" onclick="skipNut('${ND}','${p.id}')">스킵</button></div></div>`}).join('');
  return `<div class="sh">${esc(tm)}</div>${items}`}).join('');
const nav=`<div class="ndnav"><button type="button" class="btn" onclick="ND=nadd(ND,-1);draw()" aria-label="하루 전">‹</button><input type="date" id="ndin" value="${ND}" max="${td}" onchange="ND=this.value||ND;if(ND>NTODAY())ND=NTODAY();draw()"><button type="button" class="btn" ${ND>=td?'disabled':''} onclick="if(ND<NTODAY()){ND=nadd(ND,1);draw()}" aria-label="하루 후">›</button>${isT?'':`<button type="button" class="btn" onclick="ND=NTODAY();draw()">오늘</button>`}</div>`;
const hint=x.empty?'칸을 눌러 먹은 횟수를 표시하세요':x.all?'목표를 다 채웠습니다':(x.sk?`${x.sk}개 스킵 · 남은 칸을 채워 보세요`:'한 칸씩 채워 보세요');
const hero=`<div class="card nhero"><div class="ch"><h3>${isT?'오늘 진행':`${+ND.slice(5,7)}월 ${+ND.slice(8)}일 진행`}</h3>${nav}</div><div class="nprog">${nutRing(pct,x.all)}<div class="nprog-m"><div class="kv">${x.tkD}<span class="ts"> / ${x.exD}회</span></div><div class="ts">${hint}</div><div class="nstr">${st?`<b>연속 ${st}일</b><span class="ts">빠짐없이 다 먹은 날</span>`:`<b>연속 0일</b><span class="ts">하루를 다 채우면 시작됩니다</span>`}</div>${rt.ex?`<div class="ts">${ML(mm)} 복용률 ${rt.p}% (${rt.tk}/${rt.ex}회)</div>`:''}</div></div>${nutWeek()}</div>`;
const chk=`<div class="card"><div class="ch"><h3>${isT?'오늘 체크':`${+ND.slice(5,7)}월 ${+ND.slice(8)}일 체크`}</h3></div>${ps.length?rows:'<p class="ts">등록된 영양제가 없습니다.</p>'}<button class="btn" onclick="expNL()">기록 복사</button><div class="ts" style="margin-top:8px">칸을 누르면 횟수가 올라가고 지금 시각이 남습니다. 시각을 눌러 고칠 수 있어요(HH:MM, 익일 HH:MM, 메모). 다 채우면 완료, 한 번 더 누르면 지워집니다.</div></div>`;
return hero+chk+nutCover()+nutCal()+nutTips()}
function nutCover(){const N=D.nut||{},ps=NPS(),CAP=300,groups=nutGroups();
if(NV!='plan')NV='day';if(!ND||ND>NTODAY())ND=NTODAY();
const isPlan=NV=='plan',td=NTODAY(),isT=ND==td,rec=NL[ND]||{};
const frac=p=>{if(isPlan)return 1;const n=nTimes(p),v=nVal(rec[p.id],n);return n?v.k/n:0};
const tot={};ps.forEach(p=>{const f=frac(p);if(!f)return;Object.entries(p.nuts||{}).forEach(([k,v])=>tot[k]=(tot[k]||0)+v*f)});
const lg=ps.map((p,i)=>`<span><i style="background:${p.color||NPAL(i)}"></i>${esc(p.short||p.name)}</span>`).join('')+`<span><i style="background:#e5e7eb"></i>없음</span>`;
let h='';
groups.forEach(([g,ks])=>{
  h+=`<div class="ngh">${esc(g)}</div>`;
  ks.forEach(k=>{
    const ref=(N.ref||{})[k]||0,ul=(N.ul||{})[k],lab=(N.label||{})[k]||k,val=tot[k]||0,pct=ref?val/ref*100:0,over=ul!=null&&val>ul,miss=val<=0,ok=ref&&pct>=100&&!over;
    let usedW=0,segs='';
    ps.forEach((p,i)=>{
      const f=frac(p),rawAmt=((p.nuts||{})[k]||0)*f;if(!rawAmt||!ref)return;
      const raw=rawAmt/ref*100,vis=Math.max(0,Math.min(raw,CAP-usedW));usedW+=vis;
      const col=p.color||NPAL(i);
      if(vis>0)segs+=`<div class="ns" style="width:${vis/CAP*100}%;background:${col};min-width:${vis>0?'3px':'0'}" title="${esc(p.short||p.name)} ${nfmt(k,rawAmt)}"></div>`
    });
    const title=escapeAttr(`${lab} ${nfmt(k,val)} / 기준 ${ref?nfmt(k,ref):'—'} (${Math.round(pct)}%)${ul?` · 상한 ${nfmt(k,ul)}${(N.ulNote||{})[k]?' ('+N.ulNote[k]+')':''}`:''}`);
    h+=`<div class="nb ${miss?'miss':''}${ok?' ok':''}" title="${title}"><div class="nn">${esc(lab)}</div><div class="nt"><div class="ntr">${segs||''}</div><div class="nm" style="left:${100/CAP*100}%"></div></div><div class="np">${pct>=10||pct==0?Math.round(pct).toLocaleString():pct.toFixed(1)}%${over?`<span class="bd or">${(N.ulNote||{})[k]||'상한'} 초과</span>`:ok?`<span class="bd ok">✓ 완료</span>`:''}</div></div>`
  });
});
const keys=groups.flatMap(g=>g[1]).filter(k=>(N.ref||{})[k]),okN=keys.filter(k=>nutPct(k,tot[k]||0)>=100).length,x=nutDay(ND);
const sum=isPlan?`다 먹었을 때 · 권장량 충족 ${okN}/${keys.length} 영양소`:`${isT?'오늘':`${+ND.slice(5,7)}/${+ND.slice(8)}`} ${x.tkD}/${x.exD}회 · 권장량 충족 ${okN}/${keys.length} 영양소`;
const nav=`<div class="ndnav"><div class="seg"><button class="${NV=='day'?'on':''}" onclick="NV='day';draw()">날짜별</button><button class="${NV=='plan'?'on':''}" onclick="NV='plan';draw()">다 먹었을 때</button></div>${isPlan?'':`<button type="button" class="btn" onclick="ND=nadd(ND,-1);draw()" aria-label="하루 전">‹</button><input type="date" value="${ND}" max="${td}" onchange="ND=this.value||ND;if(ND>NTODAY())ND=NTODAY();draw()"><button type="button" class="btn" ${ND>=td?'disabled':''} onclick="if(ND<NTODAY()){ND=nadd(ND,1);draw()}" aria-label="하루 후">›</button>${isT?'':`<button type="button" class="btn" onclick="ND=NTODAY();draw()">오늘</button>`}`}</div>`;
const sub=isPlan?'한국 1일 영양성분 기준치 대비 · 등록된 제품을 모두 먹은 계획 · 막대는 300%에서 자르고, 숫자는 실제 비율입니다':'한국 1일 영양성분 기준치 대비 · 먹은 횟수에 비례해 합산 · 막대는 300%에서 자르고, 숫자는 실제 비율입니다';
return `<div class="card"><div class="ch"><h3>영양소 충족률</h3>${nav}</div><div class="ts" style="margin-bottom:8px">${sum}</div><div class="lg">${lg}</div>${h}<div class="ts" style="margin-top:8px">${sub}. 점선은 기준치 100%입니다.</div></div>`}
const EXSLOT=['아침','점심','저녁'];
function exDirty(){return Object.keys((XL&&XL.add)||{}).length>0||((XL&&XL.del)||[]).length>0}
function exSort(a,b){if(a.d!=b.d)return a.d<b.d?1:-1;const o=EXSLOT.indexOf(a.p)-EXSLOT.indexOf(b.p);return o||(a.k||'').localeCompare(b.k||'','ko')||String(a.id).localeCompare(String(b.id))}
function mergeEX(){const map=new Map();(D.ex||[]).forEach(x=>{if(x&&x.id)map.set(x.id,Object.assign({},x))});(XL.del||[]).forEach(id=>map.delete(id));Object.values(XL.add||{}).forEach(x=>{if(x&&x.id)map.set(x.id,Object.assign({},x))});EX=[...map.values()].sort(exSort)}
async function saveEX(){try{if(!KEY)return;const iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(XL)));localStorage.setItem('ex',JSON.stringify({i:u64(iv),c:u64(new Uint8Array(c))}))}catch(e){}}
async function loadEX(){let loc={add:{},del:[]};try{const v=JSON.parse(localStorage.getItem('ex')||'null');if(v&&KEY){const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(v.i)},KEY,b64(v.c));loc=JSON.parse(new TextDecoder().decode(p))||loc}}catch(e){loc={add:{},del:[]}}XL={add:loc.add||{},del:loc.del||[]};mergeEX()}
function exId(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
async function addEx(){const d=document.getElementById('exd').value,p=document.getElementById('expv').value,k=(document.getElementById('exk').value||'').trim(),n=+document.getElementById('exn').value,u=document.getElementById('exuv').value,r=(document.getElementById('exm').value||'').trim();if(!d||d>NTODAY())return alert('날짜를 확인해 줘');if(EXSLOT.indexOf(p)<0)return alert('시간대를 골라 줘');if(!k)return alert('운동 종류를 적어 줘');if(!n||n<=0||n!==Math.round(n))return alert('횟수나 분을 숫자로 적어 줘');if(u!='개'&&u!='분')return alert('단위는 개 또는 분이야');const rec={id:exId(),d,p,k,n,u,r};if(!XL.add)XL.add={};XL.add[rec.id]=rec;XL.del=(XL.del||[]).filter(i=>i!==rec.id);mergeEX();await saveEX();XD=d;draw()}
async function delEx(id){if(!id)return;if(XL.add&&XL.add[id])delete XL.add[id];if((D.ex||[]).some(x=>x.id==id))XL.del=Array.from(new Set([...(XL.del||[]),id]));mergeEX();await saveEX();draw()}
function expEX(){const t='[운동 기록]\n'+JSON.stringify(EX,null,2);navigator.clipboard.writeText(t).then(()=>alert('복사했어. 마속 채팅에 붙여 넣으면 원본 데이터에 반영해 둘게.'),()=>prompt('아래 내용을 복사해서 보내 줘',t))}
function exDays(n){const t=NTODAY(),a=[];for(let i=n-1;i>=0;i--)a.push(nadd(t,-i));return a}
function exIn(days){const s=new Set(days);return EX.filter(x=>s.has(x.d))}
function exKinds(rows){const m=new Map();rows.forEach(x=>{const k=x.k||'기타';if(!m.has(k))m.set(k,{k,u:x.u||'개',n:0,c:0,days:new Set()});const r=m.get(k);r.n+=+x.n||0;r.c++;r.days.add(x.d);if(x.u)r.u=x.u});return [...m.values()].sort((a,b)=>b.n-a.n||a.k.localeCompare(b.k,'ko'))}
function exPal(i){return ['#1f2d3d','#f2541b','#5b7c99','#c47b17','#3d566e','#c2410c','#7f9bb5','#059669'][i%8]}
function exSetSeg(id,v,btn){document.getElementById(id).value=v;btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn))}
function exFmt(n,u){return `${(+n||0).toLocaleString()}${u||'개'}`}
function exItems(rows){return rows.map(x=>`<li><span class="xw-p">${esc(x.p)}</span><span class="xw-k">${esc(x.k)}${x.r?`<div class="xw-memo">${esc(x.r)}</div>`:''}</span><span class="xw-v">${exFmt(x.n,x.u)}</span><button type="button" class="btn" onclick="delEx('${esc(x.id)}')">삭제</button></li>`).join('')}
function exChart(days,rows){
  if(!rows.length)return '<p class="ts">이 기간에 아직 기록이 없어요.</p>';
  const byU={};rows.forEach(x=>{(byU[x.u||'개']=byU[x.u||'개']||[]).push(x)});
  const w=NW()?340:700,h=168,x0=NW()?30:40,x1=w-8,plotW=x1-x0,n=days.length,gap=n>14?1:2,bw=Math.max(2,(plotW/n)-gap);
  let out='';
  for(const u of Object.keys(byU).sort()){
    const kinds=exKinds(byU[u]);
    const dayTot=d=>kinds.reduce((s,k)=>s+byU[u].filter(x=>x.d==d&&x.k==k.k).reduce((t,x)=>t+(+x.n||0),0),0);
    const mx=Math.max(1,...days.map(dayTot))*1.15;
    const Y=v=>h-14-v/mx*(h-28);
    let s='';
    for(let i=0;i<=4;i++){const v=mx*i/4,y=Y(v);s+=`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" class="gl"/><text x="${x0-6}" y="${y+4}" class="xw-al" text-anchor="end">${i?Math.round(v).toLocaleString():'0'}</text>`}
    days.forEach((d,i)=>{
      let yb=h-14;const x=x0+i*(plotW/n)+(plotW/n-bw)/2;
      kinds.forEach((k,ki)=>{
        const v=byU[u].filter(x=>x.d==d&&x.k==k.k).reduce((t,x)=>t+(+x.n||0),0);
        if(!v)return;
        const hh=Math.max(1,yb-Y(v));
        s+=`<rect x="${x}" y="${yb-hh}" width="${bw}" height="${hh}" fill="${exPal(ki)}" rx="1"><title>${+d.slice(5,7)}/${+d.slice(8)} ${esc(k.k)} ${exFmt(v,u)}</title></rect>`;
        yb-=hh;
      });
    });
    const labI=n>14?[0,Math.floor((n-1)/2),n-1]:[...days.keys()].filter(i=>n<=7||i%Math.ceil(n/7)==0||i==n-1);
    labI.forEach(i=>{s+=`<text x="${x0+i*(plotW/n)+(plotW/n)/2}" y="${h-2}" class="xw-xl" text-anchor="middle">${+days[i].slice(5,7)}/${+days[i].slice(8)}</text>`});
    const leg=kinds.map((k,i)=>`<span><i style="background:${exPal(i)}"></i>${esc(k.k)} <b class="xw-num">${exFmt(k.n,u)}</b></span>`).join('');
    out+=`<div class="lg r" style="margin-bottom:8px">${leg}</div><svg viewBox="0 0 ${w} ${h}" class="xw-svg" role="img" aria-label="최근 ${days.length}일 ${u} 추이">${s}</svg>`;
  }
  return out;
}

function exer(){if(!XD||XD>NTODAY())XD=NTODAY();mergeEX();const td=NTODAY(),days=exDays(XR),rows=exIn(days),today=EX.filter(x=>x.d==td).sort((a,b)=>EXSLOT.indexOf(a.p)-EXSLOT.indexOf(b.p)||(a.k||'').localeCompare(b.k||'','ko')),kinds=exKinds(rows),allK=exKinds(EX);const datalist=allK.map(k=>`<option value="${esc(k.k)}">`).join('');
const todayCard=`<div class="card xw"><div class="ch"><h3>오늘 한 운동</h3><span class="ts">${+td.slice(5,7)}월 ${+td.slice(8)}일</span></div>${today.length?`<ul class="xw-list">${exItems(today)}</ul>`:'<p class="ts">아직 오늘 기록이 없어요. 아래에서 추가해 줘.</p>'}</div>`;
const form=`<div class="card xw"><div class="ch"><h3>운동 추가</h3></div>
<div class="xw-form">
<div><label for="exd">날짜</label><input type="date" id="exd" value="${XD}" max="${td}"></div>
<div><label>시간대</label><input type="hidden" id="expv" value="아침"><div class="seg">${EXSLOT.map(p=>`<button type="button" class="${p=='아침'?'on':''}" onclick="exSetSeg('expv','${p}',this)">${p}</button>`).join('')}</div></div>
<div class="xw-wide"><label for="exk">종류</label><input type="text" id="exk" list="exkl" placeholder="예: 팔굽혀펴기, 러닝" autocomplete="off"><datalist id="exkl">${datalist}</datalist></div>

<div><label>단위</label><input type="hidden" id="exuv" value="개"><div class="seg"><button type="button" class="on" onclick="exSetSeg('exuv','개',this)">개</button><button type="button" onclick="exSetSeg('exuv','분',this)">분</button></div></div>
<div class="xw-wide"><label for="exm">메모 (선택)</label><input type="text" id="exm" placeholder="선택 사항"></div>
<div class="xw-wide"><button type="button" class="btn pb" onclick="addEx()">추가</button></div>
</div>
<div class="ts" style="margin-top:8px">종류는 자유롭게 적으면 되고, 새로 생기면 합계와 그래프에 자동으로 나타납니다.</div></div>`;
const kpis=kinds.length?`<div class="xw-kpis">${kinds.map(k=>{const spark=days.map(d=>{const v=rows.filter(x=>x.d==d&&x.k==k.k).reduce((s,x)=>s+(+x.n||0),0);const mx=Math.max(1,...days.map(dd=>rows.filter(x=>x.d==dd&&x.k==k.k).reduce((s,x)=>s+(+x.n||0),0)));return `<i class="${v?'on':''}" style="height:${Math.max(v?12:4,Math.round(v/mx*28))}px" title="${+d.slice(5,7)}/${+d.slice(8)} ${exFmt(v,k.u)}"></i>`}).join('');return `<div class="xw-kpi"><div class="k">${esc(k.k)}</div><div class="v">${exFmt(k.n,k.u)}</div><div class="s">${k.c}번 · ${k.days.size}일</div><div class="xw-spark">${spark}</div></div>`}).join('')}</div>`:'<p class="ts">이 기간에 아직 기록이 없어요.</p>';
const range=`<div class="card xw"><div class="ch"><h3>종류별 합계</h3><div class="seg">${[7,30].map(n=>`<button type="button" class="${XR==n?'on':''}" onclick="XR=${n};draw()">최근 ${n}일</button>`).join('')}</div></div>${kpis}</div>`;
const chart=`<div class="card xw"><div class="ch"><h3>추이</h3><span class="ts">같은 단위끼리 쌓아 보여 줍니다</span></div>${exChart(days,rows)}</div>`;
const groups=[];days.slice().reverse().forEach(d=>{const a=EX.filter(x=>x.d==d).sort((x,y)=>EXSLOT.indexOf(x.p)-EXSLOT.indexOf(y.p)||(x.k||'').localeCompare(y.k||'','ko'));if(a.length)groups.push([d,a])});
const log=`<div class="card xw"><div class="ch"><h3>날짜별 기록</h3><span class="ts">최근 ${XR}일</span></div>${groups.length?groups.map(([d,a])=>`<div class="xw-day"><div class="sh">${+d.slice(5,7)}월 ${+d.slice(8)}일 (${DOW[new Date(d+'T12:00:00').getDay()]})</div><ul class="xw-list">${exItems(a)}</ul></div>`).join(''):'<p class="ts">이 기간에 아직 기록이 없어요.</p>'}<button class="btn" onclick="expEX()">기록 복사</button><div class="ts" style="margin-top:8px">복사한 내용을 마속 채팅에 붙여 넣으면 원본 데이터에 반영합니다.</div></div>`;
return todayCard+form+range+chart+log}

function isNutWrap(o){return !!(o&&typeof o==='object'&&!Array.isArray(o)&&Object.keys(o).length&&Object.keys(o).every(k=>k==='log'||k==='st'))}
function nutDirty(){try{return JSON.stringify(NL)!==JSON.stringify(((D.nut&&D.nut.log)||{}))||JSON.stringify(ST)!==JSON.stringify(D.st||{})}catch(e){return false}}
function nowHM(){const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}
function nowSlot(d){const hm=nowHM(),td=NTODAY();return (d&&d===nadd(td,-1))?'익일 '+hm:hm}
function normSt(s){s=String(s||'').trim();if(!s)return '';const next=/익일|다음날|\+1/.test(s);const m=s.match(/(\d{1,2})\s*[:시]\s*(\d{2})/);if(!m)return s;let hh=+m[1],mm=m[2],nx=next;if(hh>=24){hh-=24;nx=true}const hm=String(hh).padStart(2,'0')+':'+mm;return nx?'익일 '+hm:hm}
function stArr(d,id){return ((ST[d]||{})[id]||[]).slice()}
function setStSlot(d,id,i,val){if(!ST[d])ST[d]={};const a=(ST[d][id]||[]).slice();if(val==null||val===''){if(i==null||i<0)delete ST[d][id];else{a[i]='';while(a.length&&!a[a.length-1])a.pop();if(a.length)ST[d][id]=a;else delete ST[d][id]}}else{while(a.length<i)a.push('');a[i]=normSt(val);ST[d][id]=a}if(ST[d]&&!Object.keys(ST[d]).length)delete ST[d]}
function clearSt(d,id){if(ST[d]){delete ST[d][id];if(!Object.keys(ST[d]).length)delete ST[d]}}
function stChips(d,id,k){if(!k)return '';const a=stArr(d,id).filter(x=>x!=='');const n=Math.max(k||0,a.length);const show=(!a.length)?[]:(a.length===1&&(k||0)>1)?a:Array.from({length:n},(_,i)=>a[i]||'');if(!show.length)return `<div class="nst"><button type="button" class="ghost" onclick="event.stopPropagation();editNutTime('${d}','${id}',0)">시각 추가</button></div>`;const chips=show.map((s,i)=>{const lab=s||'시각';const cls=!s?'ghost':(/^익일/.test(s)?'next':(/^\d{2}:\d{2}$/.test(s)?'':'memo'));return `<button type="button" class="${cls}" onclick="event.stopPropagation();editNutTime('${d}','${id}',${i})">${esc(lab)}</button>`}).join('');return `<div class="nst">${chips}</div>`}

async function editNutTime(d,id,i){if(d>NTODAY())return;const cur=stArr(d,id)[i]||'';const t=prompt('먹은 시각을 적어 줘. 예: 07:16, 익일 01:19, 출근 전. 비우면 지워져.',cur);if(t==null)return;setStSlot(d,id,i,t.trim());await saveNL();draw()}
function escapeAttr(s){return esc(s).replace(/`/g,'')}

function nutCal(){const t=NTODAY(),end=new Date(t+'T12:00:00'),sun=new Date(end);sun.setDate(end.getDate()-end.getDay()-28);
let h=`<div class="ncal"><div></div>${[...DOW].map(c=>`<div class="nch ${c=='일'||c=='토'?'we':''}">${c}</div>`).join('')}`;
for(let i=0;i<35;i++){
  const dt=new Date(sun);dt.setDate(sun.getDate()+i);
  const ds=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  if(i%7==0)h+=`<div class="ncm">${dt.getDate()<=7||i==0?dt.getMonth()+1+'월':''}</div>`;
  const fut=ds>t,x=fut?null:nutDay(ds),cls=fut?'fu':x.all?'all':x.part?'part':x.none?'none':'empty';
  const lab=fut?'':x.all?'전부 먹음':x.part?`${x.tkD}/${x.exD}회`:x.none?'전부 스킵':'기록 없음';
  h+=`<div class="ncd ${cls}${ds==ND?' sel':''}${ds==t?' today':''}" ${fut?'':`data-nd="${ds}" onclick="ND='${ds}';draw()"`} title="${+ds.slice(5,7)}/${+ds.slice(8)} · ${lab}"><span>${dt.getDate()}</span></div>`;
}
h+='</div>';
return `<div class="card"><div class="ch"><h3>최근 5주</h3><span class="ts">칸을 <span class="dk">클릭하거나 마우스를 올리면</span><span class="tc">누르면</span> 그날 기록으로 이동합니다</span></div>${h}<div class="lg r"><span><i class="ncd empty" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>기록 없음</span><span><i class="ncd none" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>전부 스킵</span><span><i class="ncd part" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>일부</span><span><i class="ncd all" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>전부 먹음</span></div></div>`}

function nutTips(){const tips=(D.nut&&D.nut.tips)||[];if(!tips.length)return '';
return `<div class="card"><div class="ch"><h3>맞춤 제안</h3><span class="ts">생활 습관과 현재 제품 함량을 기준으로 정리했습니다</span></div>${tips.map(x=>`<div class="ntip"><b>${esc(x.k)}${x.tag?` ${badge(x.tag,'or')}`:''}</b><div class="ts tw" style="max-width:none">${esc(x.t)}</div></div>`).join('')}</div>`}

const LV=x=>x.c=='생활비'||x.c=='쓴 돈 아님';const NEED=x=>(x.sc=='확인 필요'||x.sc=='개인 송금')&&!x.r;

const byCat=(a,io='out',k=KY)=>{const g={};a.filter(x=>x.io==io&&!LV(x)).forEach(x=>{const c=k(x);g[c]=(g[c]||0)+x.a});return Object.entries(g).sort((a,b)=>b[1]-a[1])};
const pm=m=>{let[y,mm]=m.split('-').map(Number);mm--;if(!mm){y--;mm=12}return y+'-'+String(mm).padStart(2,'0')};
const nm=m=>{let[y,mm]=m.split('-').map(Number);mm++;if(mm>12){y++;mm=1}return y+'-'+String(mm).padStart(2,'0')};
const CUR=()=>D.today.slice(0,7),DAY=()=>+D.today.slice(8),dim=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const MONTHS=()=>[...new Set(D.T.map(x=>x.d.slice(0,7)))].sort().filter(m=>m>='2025-12');
const ML=m=>+m.slice(5)+'월';

const LIFE=5500000;const SAL=x=>x.io=='in'&&(x.c=='급여'||x.sc=='부모급여'||x.sc=='아동수당');
function bud(m){const p=pm(m),I=mt(m).filter(x=>x.io=='in'&&!SAL(x)).reduce((s,x)=>s+x.a,0),X=D.T.filter(x=>SAL(x)&&(x.c=='급여'?x.bm:x.d.slice(0,7))==p).reduce((s,x)=>s+x.a,0),La=D.T.filter(x=>x.c=='생활비'&&x.bm==m).reduce((s,x)=>s+x.a,0),est=!La,L=La||LIFE;return {I,X,L,La,est,A:I+X-L}}

function daily(m){const n=dim(m),o=Array(n+1).fill(0),f=Array(n+1).fill(0);mt(m).filter(x=>x.io=='out'&&!LV(x)).forEach(x=>{const d=+x.d.slice(8);o[d]+=x.a;if(x.f)f[d]+=x.a});return {o,f}}
function balAt(m){let k=0,h=0;for(const x of MONTHS()){if(x>m)break;if(D.kbal[x]!=null)k=D.kbal[x];if(D.hbal[x]!=null)h=D.hbal[x]}return {k,h}}

function resetEd(id){delete OV[id];applyOV();saveOV();ED=null;draw()}
function expOV(){const t='[가계부 수정]\n'+Object.entries(OV).map(([k,o])=>{const x=D.T.find(y=>y.id==k);return `${k} | ${x.d} ${x.m} ${x.a.toLocaleString()}원 | ${o.c} › ${o.sc} | ${o.r||''}`}).join('\n');navigator.clipboard.writeText(t).then(()=>alert('복사했어. 마속 채팅에 붙여 넣으면 원본 데이터에 반영해 둘게.'),()=>prompt('아래 내용을 복사해서 보내 줘',t))}
function draw(){document.getElementById('side').innerHTML=side()+goals();document.getElementById('tabs').innerHTML=seg(TAB,'TAB',[['m',ML(M)+' 보기'],['y','월별 정리'],['b','예산 제안']]);document.getElementById('main').innerHTML=TAB=='y'?monthly()+mChart():TAB=='b'?budget():alerts()+cumChart()+dayBars()+cats()+heat()+fixed()+txs();document.getElementById('ttl').textContent=TAB=='y'?'월별 정리':TAB=='b'?'예산 제안':`${M.slice(0,4)}년 ${ML(M)}`}
function render(){document.getElementById('lock').style.display='none';const a=document.getElementById('app');a.style.display='';const tdt=new Date(D.today);
a.innerHTML=`<header><div class="hw"><b class="brand">✱ 가계부</b><span class="sp"></span><span class="tp">오늘 · ${+D.today.slice(5,7)}/${+D.today.slice(8)} ${DOW[tdt.getDay()]}</span><span class="ts">국민·하나·국민카드 기준</span></div><div class="hw2"><div class="tt"><h1 id="ttl"></h1><div id="tabs" class="tabs"></div></div><div class="sub ts">쓸 수 있는 돈은 그 달에 들어온 돈(월급·부모수당 제외)에 지난달 월급과 부모수당을 더하고, 지난달 말이나 그 달 초에 보낸 생활비를 뺀 금액이야. 생활비를 아직 안 보냈으면 550만 원으로 잡아.</div></div></header><div class="wrap"><div class="grid"><aside id="side"></aside><main id="main"></main></div></div>`;
D.T.forEach(x=>{x.c0=x.c;x.sc0=x.sc;x.r0=x.r||'';x.bm=(x.c=='급여'&&+x.d.slice(8)<=10)?pm(x.d.slice(0,7)):(x.c=='생활비'&&+x.d.slice(8)>=21)?nm(x.d.slice(0,7)):x.d.slice(0,7)});M=CUR();applyOV();draw();tipInit();const sh=()=>document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');sh();addEventListener('resize',sh)}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function go(){const pw=document.getElementById('pw').value;try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},key,b64(E.c));D=JSON.parse(new TextDecoder().decode(p));sessionStorage.setItem('k',pw);KEY=await crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('namgung-ov-v1'),iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);await loadOV();render()}catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않아요'}}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key=='Enter')go()});
if(sessionStorage.getItem('k')){document.getElementById('pw').value=sessionStorage.getItem('k');go()}

function mChart(){const ms=MONTHS(),rows=ms.map(m=>{const b=bud(m),o=sum(mt(m),'out');return {m,A:b.A,o}}),mx=Math.max(1,...rows.flatMap(r=>[r.A,r.o]))*1.1,w=700,h=200,x0=48,bw=(w-x0-10)/rows.length;let g=axisY(mx,h,x0,w-10);
rows.forEach((r,i)=>{const x=x0+i*bw,y=v=>h-Math.max(0,v)/mx*(h-14),bwi=bw*.32;g+=`<rect x="${x+bw*.16}" y="${y(r.A)}" width="${bwi}" height="${h-y(r.A)}" fill="#a3bccf" rx="2"/><rect x="${x+bw*.5}" y="${y(r.o)}" width="${bwi}" height="${h-y(r.o)}" fill="${r.o>r.A?'#c2410c':'#1f2d3d'}" rx="2"/><text x="${x+bw/2}" y="${h+16}" class="al" text-anchor="middle">${ML(r.m)}</text>`});
return `<div class="card"><div class="ch"><h3>달마다 쓸 수 있는 돈과 쓴 돈</h3><span class="ts">주황 막대는 쓸 수 있는 돈보다 더 쓴 달</span></div><div class="lg"><span><i style="background:#a3bccf"></i>쓸 수 있는 돈</span><span><i style="background:#1f2d3d"></i>쓴 돈</span></div><svg viewBox="0 0 ${w} ${h+24}">${g}</svg></div>`}
function tipInit(){let t=document.getElementById('tip');if(!t){t=document.createElement('div');t.id='tip';document.body.appendChild(t)}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-hd]');if(!el){t.style.display='none';return}const d=+el.dataset.hd,c=el.dataset.hc,ds=M+'-'+String(d).padStart(2,'0'),dt=new Date(ds);
const a=D.T.filter(x=>x.d==ds&&x.io=='out'&&!LV(x)&&(!c||KY(x)==c)).sort((x,y)=>y.a-x.a);if(!a.length){t.style.display='none';return}const tot=a.reduce((s,x)=>s+x.a,0),sh=a.slice(0,12);
t.innerHTML=`<div class="th"><b>${+ds.slice(5,7)}/${d} ${DOW[dt.getDay()]}${c?' · '+c:''}</b><span>${F(tot)}${a.length>1?` · ${a.length}건`:''}</span></div>${sh.map(x=>`<div class="tr"><span class="tm">${x.t||''}</span><span class="tn">${x.m}${c?'':`<em>${x.c}</em>`}${x.f?' <em>고정비</em>':''}</span><b>${x.a.toLocaleString()}</b></div>`).join('')}${a.length>12?`<div class="tm" style="margin-top:4px">외 ${a.length-12}건</div>`:''}`;t.style.display='block';pos(e)});
document.addEventListener('mousemove',e=>{if(t.style.display=='block')pos(e)});
function pos(e){const r=t.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;t.style.left=x+'px';t.style.top=Math.max(8,y)+'px'}}
function budget(){const c=CUR(),m3=[pm(pm(pm(c))),pm(pm(c)),pm(c)],P=D.plan||{};const g={};
D.T.forEach(x=>{if(x.io!='out'||LV(x))return;const mm=x.d.slice(0,7),i=m3.indexOf(mm);const k=x.c+'|'+x.sc;if(!g[k])g[k]={c:x.c,sc:x.sc,v:[0,0,0],n:0,f:0,now:0};const r=g[k];if(i>=0){r.v[i]+=x.a;r.n++;if(x.f)r.f++}if(mm==c)r.now+=x.a});
const rows=Object.values(g).map(r=>{r.avg=(r.v[0]+r.v[1]+r.v[2])/3;const p=P[r.sc];r.tg=p&&p[0]!=null?Math.min(p[0],r.avg):r.avg;r.tip=p?p[1]:'';r.sv=r.avg-r.tg;r.ty=r.f>=r.n/2&&r.f>0?'고정':r.n/3>=4?'자주':'가끔';return r}).filter(r=>r.avg>0||r.now>0);
const byC={};rows.forEach(r=>{(byC[r.c]=byC[r.c]||[]).push(r)});const cs=Object.entries(byC).map(([c,a])=>({c,a:a.sort((x,y)=>y.avg-x.avg),avg:a.reduce((s,r)=>s+r.avg,0),tg:a.reduce((s,r)=>s+r.tg,0),now:a.reduce((s,r)=>s+r.now,0)})).sort((x,y)=>y.avg-x.avg);
const TA=cs.reduce((s,x)=>s+x.avg,0),TT=cs.reduce((s,x)=>s+x.tg,0),SV=TA-TT,FX=rows.filter(r=>r.ty=='고정').reduce((s,r)=>s+r.avg,0);
const top=rows.filter(r=>r.sv>0).sort((x,y)=>y.sv-x.sv);const B=bud(c);
const k=(t,v,s)=>`<div class="card bk"><div class="ts">${t}</div><div class="kv">${v}</div><div class="ts">${s}</div></div>`;
const mx=Math.max(1,...cs.map(x=>x.avg))*1.05;
const chart=`<div class="card"><div class="ch"><h3>비목별 · 지금 평균과 제안</h3><span class="ts">${m3.map(ML).join('·')} 평균, 생활비 빼고</span></div><div class="lg"><span><i style="background:#c5ced8"></i>최근 3개월 평균</span><span><i style="background:#1f2d3d"></i>제안</span></div>${cs.map(x=>`<div class="bb"><div class="bn">${x.c}</div><div class="bt"><div class="b1" style="width:${x.avg/mx*100}%"></div><div class="b2" style="width:${x.tg/mx*100}%"></div></div><div class="bv">${W(x.avg)} → <b>${W(x.tg)}</b>${x.avg-x.tg>500?` <span class="pos">−${W(x.avg-x.tg)}</span>`:''}</div></div>`).join('')}</div>`;
const tipc=`<div class="card"><div class="ch"><h3>이렇게 바꾸면 · 한 달 ${W(SV)}, 1년 ${W(SV*12)} 아껴</h3><span class="ts">아끼는 돈이 큰 순서</span></div><table><thead><tr><th>세목</th><th class="r">지금 평균</th><th class="r">제안</th><th class="r">한 달 절약</th><th>어떻게</th></tr></thead><tbody>${top.map(r=>`<tr><td><b>${r.sc}</b> <span class="ts">${r.c}</span></td><td class="r">${W(r.avg)}</td><td class="r"><b>${W(r.tg)}</b></td><td class="r pos"><b>−${W(r.sv)}</b></td><td class="ts tw">${esc(r.tip)}</td></tr>`).join('')}</tbody></table></div>`;
const tbl=`<div class="card"><div class="ch"><h3>세목별 예산 · ${ML(c)}은 지금까지 얼마 썼나</h3><span class="ts">고정은 매달 자동으로 나가는 것, 자주는 한 달 4번 넘게 쓰는 것</span></div><table><thead><tr><th>세목</th><th>성격</th><th class="r">한 달 횟수</th>${m3.map(m=>`<th class="r">${ML(m)}</th>`).join('')}<th class="r">평균</th><th class="r">제안</th><th>${ML(c)} 지금까지</th></tr></thead><tbody>${cs.map(x=>`<tr class="gh"><td colspan="3"><b>${x.c}</b></td><td colspan="3"></td><td class="r"><b>${W(x.avg)}</b></td><td class="r"><b>${W(x.tg)}</b></td><td>${pb(x.now,x.tg)}</td></tr>`+x.a.map(r=>`<tr><td style="padding-left:18px">${r.sc}${r.tip&&r.sv<=0?` <span class="ts" title="${esc(r.tip)}">ⓘ</span>`:''}</td><td>${badge(r.ty,r.ty=='고정'?'gr':r.ty=='자주'?'or':'gr')}</td><td class="r ts">${(r.n/3).toFixed(1)}</td>${r.v.map(v=>`<td class="r ts">${v?W(v):'-'}</td>`).join('')}<td class="r">${W(r.avg)}</td><td class="r">${r.sv>0?`<b>${W(r.tg)}</b>`:`<span class="ts">${W(r.tg)}</span>`}</td><td>${pb(r.now,r.tg,r.sv<=0)}</td></tr>`).join('')).join('')}</tbody></table><div class="ts" style="margin-top:8px">${esc((P['확인 필요']||[])[1]||'')}</div></div>`;
return `<div class="kg">${k('최근 3개월 한 달 평균',W(TA),`고정 ${W(FX)} 포함, 생활비 빼고`)}${k('제안대로 쓰면',W(TT),`${ML(c)} 쓸 수 있는 돈 ${W(B.A)}`)}${k('한 달에 아끼는 돈',`<span class="pos">${W(SV)}</span>`,`1년이면 ${W(SV*12)}`)}</div>`+tipc+chart+tbl}
function pb(v,t,nu){if(!t&&!v)return '<span class="ts">-</span>';const r=t?Math.min(100,v/t*100):100,o=v>t&&!nu;return `<div class="pg"><div class="gb"><div style="width:${r}%;background:${o?'#c2410c':'#3d566e'}"></div></div><span class="ts ${o?'neg':''}">${W(v)}</span></div>`}
</script></body></html>

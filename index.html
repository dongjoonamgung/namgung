<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dashboard</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2310b981'/><rect x='14' y='34' width='8' height='16' rx='2' fill='white'/><rect x='28' y='24' width='8' height='26' rx='2' fill='white'/><rect x='42' y='14' width='8' height='36' rx='2' fill='white'/></svg>">
<style>body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;margin:0;background:#f6f7f9;color:#1b1f24}.w{max-width:1000px;margin:0 auto;padding:24px}h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:28px 0 10px}.s{color:#666;font-size:14px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.c{background:#fff;border:1px solid #e3e5e8;border-radius:14px;padding:16px}.v{font-size:24px;font-weight:600}.l{font-size:13px;color:#555;margin-top:4px}.d{font-size:12px;color:#888}.neg{color:#c0392b}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e3e5e8;border-radius:14px;overflow:hidden;font-size:14px}td,th{padding:9px 12px;border-bottom:1px solid #eee;text-align:left}th{background:#fafbfc;font-weight:600;color:#555}td.r,th.r{text-align:right}.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar span.n{width:170px;flex-shrink:0}.bar div.t{height:14px;border-radius:7px;background:#3b82f6}.lg{display:flex;gap:14px;font-size:13px;margin-bottom:8px;flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}#lock{max-width:340px;margin:18vh auto;text-align:center}input{font-size:16px;padding:10px;border:1px solid #ccc;border-radius:10px;width:100%;box-sizing:border-box}button{margin-top:10px;font-size:15px;padding:10px 16px;border:0;border-radius:10px;background:#1b1f24;color:#fff;width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.two{grid-template-columns:1fr}.bar span.n{width:120px}}</style></head><body>

const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
async function go(){try{const p=document.getElementById('pw').value;const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(E.s),iterations:E.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(E.i)},k,u(E.c));render(JSON.parse(new TextDecoder().decode(pt)))}catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않아요'}}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function chart(d){const W=940,H=260,P=36,n=d.months.length,mx=Math.max(...d.income,...d.living,...d.card);const S=[['들어온 돈',d.income,'#3b82f6'],['생활비',d.living,'#f5b301'],['카드',d.card,'#14b8a6']];const gw=(W-P)/n,bw=gw/4;let s=`<svg viewBox="0 0 ${W} ${H+24}" width="100%">`;for(let t=0;t<=4;t++){const y=H-(H-10)*t/4;s+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="#eee"/><text x="0" y="${y+4}" font-size="11" fill="#888">${Math.round(mx*t/4)}</text>`}d.months.forEach((m,i)=>{S.forEach((x,j)=>{const h=(H-10)*x[1][i]/mx;s+=`<rect x="${P+i*gw+bw*(j+0.5)}" y="${H-h}" width="${bw-2}" height="${h}" rx="2" fill="${x[2]}"><title>${x[0]} ${x[1][i]}만</title></rect>`});s+=`<text x="${P+i*gw+gw/2}" y="${H+16}" font-size="12" text-anchor="middle" fill="#666">${m}</text>`});s+='</svg>';return `<div class="lg">${S.map(x=>`<span><i style="background:${x[2]}"></i>${x[0]}</span>`).join('')}</div>`+s}
function tbl(h,rows,ra){return `<table><tr>${h.map((x,i)=>`<th class="${ra&&i>0?'r':''}">${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${ra&&i>0?'r':''}">${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`}
function render(d){document.getElementById('lock').style.display='none';const a=document.getElementById('app');a.style.display='block';const cm=Math.max(...d.cats.map(x=>x[1]));
a.innerHTML=`<h1>재정 대시보드</h1><div class="s">${d.period} · 국민 통장, 하나 통장, 국민카드 합산 · 단위 만 원 · 업데이트 ${d.updated}</div>
<h2>한눈에 보기</h2><div class="g">${d.metrics.map((m,i)=>`<div class="c"><div class="v ${i==3?'neg':''}">${m[0]}</div><div class="l">${m[1]}</div><div class="d">${m[2]}</div></div>`).join('')}</div>
<h2>월별 흐름</h2><div class="c">${chart(d)}<div class="d">8월은 생활비 송금 기록이 없고, 11월은 진행 중이라 뺐어요.</div></div>
<h2>고정비 (월 약 80만)</h2>${tbl(['항목','월 금액','결제'],d.fixed)}
<div class="two"><div><h2>카드 카테고리 (1년)</h2><div class="c">${d.cats.map(x=>`<div class="bar"><span class="n">${esc(x[0])}</span><div class="t" style="width:${Math.max(4,x[1]/cm*100)*0.55}%"></div><span>${x[1]}만</span></div>`).join('')}</div></div>
<div><h2>많이 쓴 가맹점 (1년)</h2>${tbl(['가맹점','금액','횟수'],d.merchants,1)}</div></div>
<h2>절약 목표</h2>${tbl(['목표','내용','효과'],d.goals)}
<h2>들어온 돈</h2><div class="c">${esc(d.income_note)}</div>`}
</script></body></html>

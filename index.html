const chart=`<div class="card"><div class="ch"><h3>비목별 · 지금 평균과 제안</h3><span class="ts">${m3.map(ML).join('·')} 평균, 생활비 빼고</span></div><div class="lg"><span><i style="background:#c5ced8"></i>최근 3개월 평균</span><span><i style="background:#1f2d3d"></i>제안</span></div>${cs.map(x=>`<div class="bb"><div class="bn">${x.c}</div><div class="bt"><div class="b1" style="width:${x.avg/mx*100}%"></div><div class="b2" style="width:${x.tg/mx*100}%"></div></div><div class="bv">${W(x.avg)} → <b>${W(x.tg)}</b>${x.avg-x.tg>500?` <span class="pos">−${W(x.avg-x.tg)}</span>`:''}</div></div>`).join('')}</div>`;
const tipc=`<div class="card"><div class="ch"><h3>이렇게 바꾸면 · 한 달 ${W(SV)}, 1년 ${W(SV*12)} 아껴</h3><span class="ts">아끼는 돈이 큰 순서</span></div><table><thead><tr><th>세목</th><th class="r">지금 평균</th><th class="r">제안</th><th class="r">한 달 절약</th><th>어떻게</th></tr></thead><tbody>${top.map(r=>`<tr><td><b>${r.sc}</b> <span class="ts">${r.c}</span></td><td class="r">${W(r.avg)}</td><td class="r"><b>${W(r.tg)}</b></td><td class="r pos"><b>−${W(r.sv)}</b></td><td class="ts tw">${esc(r.tip)}</td></tr>`).join('')}</tbody></table></div>`;
const tbl=`<div class="card"><div class="ch"><h3>세목별 예산 · ${ML(c)}은 지금까지 얼마 썼나</h3><span class="ts">고정은 매달 자동으로 나가는 것, 자주는 한 달 4번 넘게 쓰는 것</span></div><table><thead><tr><th>세목</th><th>성격</th><th class="r">한 달 횟수</th>${m3.map(m=>`<th class="r">${ML(m)}</th>`).join('')}<th class="r">평균</th><th class="r">제안</th><th>${ML(c)} 지금까지</th></tr></thead><tbody>${cs.map(x=>`<tr class="gh"><td colspan="3"><b>${x.c}</b></td><td colspan="3"></td><td class="r"><b>${W(x.avg)}</b></td><td class="r"><b>${W(x.tg)}</b></td><td>${pb(x.now,x.tg)}</td></tr>`+x.a.map(r=>`<tr><td style="padding-left:18px">${r.sc}${r.tip&&r.sv<=0?` <span class="ts" title="${esc(r.tip)}">ⓘ</span>`:''}</td><td>${badge(r.ty,r.ty=='고정'?'gr':r.ty=='자주'?'or':'gr')}</td><td class="r ts">${(r.n/3).toFixed(1)}</td>${r.v.map(v=>`<td class="r ts">${v?W(v):'-'}</td>`).join('')}<td class="r">${W(r.avg)}</td><td class="r">${r.sv>0?`<b>${W(r.tg)}</b>`:`<span class="ts">${W(r.tg)}</span>`}</td><td>${pb(r.now,r.tg,r.sv<=0)}</td></tr>`).join('')).join('')}</tbody></table><div class="ts" style="margin-top:8px">${esc((P['확인 필요']||[])[1]||'')}</div></div>`;
return `<div class="kg">${k('최근 3개월 한 달 평균',W(TA),`고정 ${W(FX)} 포함, 생활비 빼고`)}${k('제안대로 쓰면',W(TT),`${ML(c)} 쓸 수 있는 돈 ${W(B.A)}`)}${k('한 달에 아끼는 돈',`<span class="pos">${W(SV)}</span>`,`1년이면 ${W(SV*12)}`)}</div>`+tipc+chart+useVsPlan()+tbl}
function pb(v,t,nu){if(!t&&!v)return '<span class="ts">-</span>';const r=t?Math.min(100,v/t*100):100,o=v>t&&!nu;return `<div class="pg"><div class="gb"><div style="width:${r}%;background:${o?'#c2410c':'#3d566e'}"></div></div><span class="ts ${o?'neg':''}">${W(v)}</span></div>`}

function NTODAY(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function nadd(d,k){const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+k);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function NPS(){return (D.nut&&D.nut.products)||[]}
function NPAL(i){return ['#1f2d3d','#5b7c99','#f2541b','#7f9bb5','#c2410c','#3d566e'][i%6]}
async function saveNL(){try{if(!KEY)return;const iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(NL)));localStorage.setItem('nut',JSON.stringify({i:u64(iv),c:u64(new Uint8Array(c))}))}catch(e){}}
async function loadNL(){let loc={};try{const v=JSON.parse(localStorage.getItem('nut')||'null');if(v&&KEY){const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(v.i)},KEY,b64(v.c));loc=JSON.parse(new TextDecoder().decode(p))||{}}}catch(e){loc={}}const base=((D.nut&&D.nut.log)?JSON.parse(JSON.stringify(D.nut.log)):{})||{};NL=base;for(const d in loc)NL[d]=Object.assign({},NL[d]||{},loc[d])}
async function setNut(d,id,st){if(d>NTODAY())return;if(!NL[d])NL[d]={};if(NL[d][id]==st)delete NL[d][id];else NL[d][id]=st;if(!Object.keys(NL[d]).length)delete NL[d];await saveNL();draw()}
function expNL(){const t='[영양제 기록]\n'+JSON.stringify(NL,null,2);navigator.clipboard.writeText(t).then(()=>alert('복사했어. 마속 채팅에 붙여 넣으면 원본 데이터에 반영해 둘게.'),()=>prompt('아래 내용을 복사해서 보내 줘',t))}
function nfmt(k,v){const u=((D.nut.unit||{})[k]||'').replace(' RAE','').replace(' α-TE','').replace(' NE',''),n=v==null?0:v,s=(Math.abs(n)>=10||n===0?Math.round(n):Math.round(n*10)/10).toLocaleString();let t=s+u;if(k=='비타민D')t+=` (${Math.round(n*40)}IU)`;return t}
function nutGroups(){const N=D.nut||{},seen=new Set();const groups=(N.groups||[]).map(([g,ks])=>{ks.forEach(k=>seen.add(k));return [g,ks.slice()]});const extra=[];NPS().forEach(p=>Object.keys(p.nuts||{}).forEach(k=>{if(!seen.has(k)){extra.push(k);seen.add(k)}}));Object.keys(N.ref||{}).forEach(k=>{if(!seen.has(k)){extra.push(k);seen.add(k)}});if(extra.length){const i=groups.findIndex(g=>g[0]=='기타');if(i>=0)groups[i][1]=groups[i][1].concat(extra);else groups.push(['기타',extra])}return groups}
function nutDay(d){const ps=NPS(),rec=NL[d]||{},tk=ps.filter(p=>rec[p.id]=='took').length,sk=ps.filter(p=>rec[p.id]=='skip').length,miss=ps.length-tk-sk;return {tk,sk,miss,n:ps.length,rec,all:ps.length>0&&tk==ps.length,part:tk>0&&tk<ps.length,none:sk>0&&tk==0&&miss==0,empty:!tk&&!sk}}
function nutStreak(){const t=NTODAY();let d=t,s=0;if(nutDay(t).empty)d=nadd(t,-1);while(d>='2020-01-01'){const x=nutDay(d);if(!x.all)break;s++;d=nadd(d,-1)}return s}
function nutRate(m){const t=NTODAY(),ps=NPS().length,n=dim(m);if(!ps)return {p:0,tk:0,ex:0};let tk=0,ex=0;for(let i=1;i<=n;i++){const d=m+'-'+String(i).padStart(2,'0');if(d>t)break;const x=nutDay(d);if(d==t&&x.empty)continue;tk+=x.tk;ex+=ps}return {p:ex?Math.round(tk/ex*100):0,tk,ex}}
function nutPct(k,tot){const r=(D.nut.ref||{})[k];return r?tot/r*100:0}

function nutri(){if(!ND||ND>NTODAY())ND=NTODAY();const N=D.nut||{},ps=NPS(),td=NTODAY(),isT=ND==td,x=nutDay(ND),mm=ND.slice(0,7),rt=nutRate(mm),st=nutStreak();
const tot={};ps.forEach(p=>Object.entries(p.nuts||{}).forEach(([k,v])=>tot[k]=(tot[k]||0)+v));
const keys=nutGroups().flatMap(g=>g[1]),ok=keys.filter(k=>nutPct(k,tot[k]||0)>=100).length;
const k=(t,v,s)=>`<div class="card bk"><div class="ts">${t}</div><div class="kv">${v}</div><div class="ts">${s}</div></div>`;
const kpi=`<div class="kg">${k(isT?'오늘 복용':`${+ND.slice(5,7)}/${+ND.slice(8)} 복용`,`${x.tk}/${x.n}`,x.sk?`${x.sk}건 스킵`:(x.empty?'아직 체크 전':''))}${k(ML(mm)+' 복용률',rt.p+'%',rt.ex?`${rt.tk}/${rt.ex}회`: '기록 없음')}${k('연속 복용',st?st+'일':'0일',st?'빠짐없이 먹은 날':'오늘부터 다시 세면 됩니다')}${k('기준치 이상',`${ok}/${keys.length}`, '제품 함량 합산 기준')}</div>`;
const times=[...new Set(ps.map(p=>p.timing||'기타'))];
const order=['아침 식후','아침·오후','점심 식전','점심 식후','저녁 식후','취침 전'];
times.sort((a,b)=>(order.indexOf(a)+99)-(order.indexOf(b)+99));
const rows=times.map(tm=>{
  const items=ps.filter(p=> (p.timing||'기타')==tm).map(p=>{
    const stt=(NL[ND]||{})[p.id],until=p.until?`<div class="ts">소비기한 ${p.until.slice(0,4)}.${p.until.slice(5,7)}.${p.until.slice(8)}</div>`:'';
    return `<div class="nr"><div class="nri"><b>${esc(p.name)}</b><div class="ts">${esc(p.per||p.dose||'')}</div>${until}</div><div class="nrb"><button class="${stt=='took'?'on took':''}" onclick="setNut('${ND}','${p.id}','took')">먹음</button><button class="${stt=='skip'?'on skip':''}" onclick="setNut('${ND}','${p.id}','skip')">스킵</button></div></div>`}).join('');
  return `<div class="sh">${esc(tm)}</div>${items}`}).join('');
const nav=`<div class="ndnav"><button type="button" class="btn" onclick="ND=nadd(ND,-1);draw()" aria-label="하루 전">‹</button><input type="date" id="ndin" value="${ND}" max="${td}" onchange="ND=this.value||ND;if(ND>NTODAY())ND=NTODAY();draw()"><button type="button" class="btn" ${ND>=td?'disabled':''} onclick="if(ND<NTODAY()){ND=nadd(ND,1);draw()}" aria-label="하루 후">›</button>${isT?'':`<button type="button" class="btn" onclick="ND=NTODAY();draw()">오늘</button>`}</div>`;
const chk=`<div class="card"><div class="ch"><h3>${isT?'오늘 체크':`${+ND.slice(5,7)}월 ${+ND.slice(8)}일 체크`}</h3>${nav}</div>${ps.length?rows:'<p class="ts">등록된 영양제가 없습니다.</p>'}<button class="btn" onclick="expNL()">기록 복사</button><div class="ts" style="margin-top:8px">먹음·스킵을 다시 누르면 기록이 지워집니다. 과거 날짜를 골라 수정할 수 있습니다.</div></div>`;
return kpi+chk+nutCover()+nutCal()+nutTips()}

function nutCover(){const N=D.nut||{},ps=NPS(),CAP=300,groups=nutGroups();
if(NV!='plan')NV='day';if(!ND||ND>NTODAY())ND=NTODAY();
const isPlan=NV=='plan',td=NTODAY(),isT=ND==td,rec=NL[ND]||{},used=isPlan?ps:ps.filter(p=>rec[p.id]=='took');
const tot={};used.forEach(p=>Object.entries(p.nuts||{}).forEach(([k,v])=>tot[k]=(tot[k]||0)+v));
const lg=ps.map((p,i)=>`<span><i style="background:${p.color||NPAL(i)}"></i>${esc(p.short||p.name)}</span>`).join('')+`<span><i style="background:#e5e7eb"></i>없음</span>`;
let h='';
groups.forEach(([g,ks])=>{
  h+=`<div class="ngh">${esc(g)}</div>`;
  ks.forEach(k=>{
    const ref=(N.ref||{})[k]||0,ul=(N.ul||{})[k],lab=(N.label||{})[k]||k,val=tot[k]||0,pct=ref?val/ref*100:0,over=ul!=null&&val>ul,miss=val<=0;
    let usedW=0,segs='';
    used.forEach((p,i)=>{
      const v=(p.nuts||{})[k]||0;if(!v||!ref)return;
      const raw=v/ref*100,vis=Math.max(0,Math.min(raw,CAP-usedW));usedW+=vis;
      const col=p.color||NPAL(ps.indexOf(p));
      if(vis>0)segs+=`<div class="ns" style="width:${vis/CAP*100}%;background:${col};min-width:${vis>0?'3px':'0'}" title="${esc(p.short||p.name)} ${nfmt(k,v)}"></div>`
    });
    const title=escapeAttr(`${lab} ${nfmt(k,val)} / 기준 ${ref?nfmt(k,ref):'—'} (${Math.round(pct)}%)${ul?` · 상한 ${nfmt(k,ul)}${(N.ulNote||{})[k]?' ('+N.ulNote[k]+')':''}`:''}`);
    h+=`<div class="nb ${miss?'miss':''}" title="${title}"><div class="nn">${esc(lab)}</div><div class="nt"><div class="ntr">${segs||''}</div><div class="nm" style="left:${100/CAP*100}%"></div></div><div class="np">${pct>=10||pct==0?Math.round(pct).toLocaleString():pct.toFixed(1)}%${over?`<span class="bd or">${(N.ulNote||{})[k]||'상한'} 초과</span>`:''}</div></div>`
  });
});
const keys=groups.flatMap(g=>g[1]).filter(k=>(N.ref||{})[k]),ok=keys.filter(k=>nutPct(k,tot[k]||0)>=100).length,x=nutDay(ND);
const sum=isPlan?`다 먹었을 때 · 권장량 충족 ${ok}/${keys.length} 영양소`:`${isT?'오늘':`${+ND.slice(5,7)}/${+ND.slice(8)}`} 먹음 ${x.tk}/${x.n} · 권장량 충족 ${ok}/${keys.length} 영양소`;
const nav=`<div class="ndnav"><div class="seg"><button class="${NV=='day'?'on':''}" onclick="NV='day';draw()">날짜별</button><button class="${NV=='plan'?'on':''}" onclick="NV='plan';draw()">다 먹었을 때</button></div>${isPlan?'':`<button type="button" class="btn" onclick="ND=nadd(ND,-1);draw()" aria-label="하루 전">‹</button><input type="date" value="${ND}" max="${td}" onchange="ND=this.value||ND;if(ND>NTODAY())ND=NTODAY();draw()"><button type="button" class="btn" ${ND>=td?'disabled':''} onclick="if(ND<NTODAY()){ND=nadd(ND,1);draw()}" aria-label="하루 후">›</button>${isT?'':`<button type="button" class="btn" onclick="ND=NTODAY();draw()">오늘</button>`}`}</div>`;
const sub=isPlan?'한국 1일 영양성분 기준치 대비 · 등록된 제품을 모두 먹은 계획 · 막대는 300%에서 자르고, 숫자는 실제 비율입니다':'한국 1일 영양성분 기준치 대비 · 그날 먹음으로 체크한 제품만 · 막대는 300%에서 자르고, 숫자는 실제 비율입니다';
return `<div class="card"><div class="ch"><h3>영양소 충족률</h3>${nav}</div><div class="ts" style="margin-bottom:8px">${sum}</div><div class="lg">${lg}</div>${h}<div class="ts" style="margin-top:8px">${sub}. 점선은 기준치 100%입니다.</div></div>`}
function escapeAttr(s){return esc(s).replace(/`/g,'')}

function nutCal(){const t=NTODAY(),end=new Date(t+'T12:00:00'),sun=new Date(end);sun.setDate(end.getDate()-end.getDay()-28);
let h=`<div class="ncal"><div></div>${[...DOW].map(c=>`<div class="nch ${c=='일'||c=='토'?'we':''}">${c}</div>`).join('')}`;
for(let i=0;i<35;i++){
  const dt=new Date(sun);dt.setDate(sun.getDate()+i);
  const ds=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  if(i%7==0)h+=`<div class="ncm">${dt.getDate()<=7||i==0?dt.getMonth()+1+'월':''}</div>`;
  const fut=ds>t,x=fut?null:nutDay(ds),cls=fut?'fu':x.all?'all':x.part?'part':x.none?'none':'empty';
  const lab=fut?'':x.all?'전부 먹음':x.part?`${x.tk}/${x.n} 먹음`:x.none?'전부 스킵':'기록 없음';
  h+=`<div class="ncd ${cls}${ds==ND?' sel':''}${ds==t?' today':''}" ${fut?'':`data-nd="${ds}" onclick="ND='${ds}';draw()"`} title="${+ds.slice(5,7)}/${+ds.slice(8)} · ${lab}"><span>${dt.getDate()}</span></div>`;
}
h+='</div>';
return `<div class="card"><div class="ch"><h3>최근 5주</h3><span class="ts">칸을 <span class="dk">클릭하거나 마우스를 올리면</span><span class="tc">누르면</span> 그날 기록으로 이동합니다</span></div>${h}<div class="lg r"><span><i class="ncd empty" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>기록 없음</span><span><i class="ncd none" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>전부 스킵</span><span><i class="ncd part" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>일부</span><span><i class="ncd all" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>전부 먹음</span></div></div>`}

function nutTips(){const tips=(D.nut&&D.nut.tips)||[];if(!tips.length)return '';
return `<div class="card"><div class="ch"><h3>맞춤 제안</h3><span class="ts">생활 습관과 현재 제품 함량을 기준으로 정리했습니다</span></div>${tips.map(x=>`<div class="ntip"><b>${esc(x.k)}${x.tag?` ${badge(x.tag,'or')}`:''}</b><div class="ts tw" style="max-width:none">${esc(x.t)}</div></div>`).join('')}</div>`}
</script></body></html>

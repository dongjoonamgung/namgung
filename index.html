const LV=x=>x.c=='생활비';

const LIFE=5500000;function bud(m){const a=mtB(m),I=a.filter(x=>x.io=='in').reduce((s,x)=>s+x.a,0),La=mt(m).filter(LV).reduce((s,x)=>s+x.a,0),L=LIFE;let X=0,xn=[];if(m==CUR())for(const c of['급여','육아수당'])if(!a.some(x=>x.c==c)){const p=mtB(pm(m)).filter(x=>x.c==c).reduce((s,x)=>s+x.a,0);if(p){X+=p;xn.push(c)}}return {I,L,La,X,xn,A:I+X-L}}
function proj(m){const a=mt(m),S=sum(a,'out');if(m!=CUR())return S;const fd=a.filter(x=>x.io=='out'&&x.f&&!LV(x)).reduce((s,x)=>s+x.a,0),fl=D.fix.filter(r=>!r.yr&&r.nx.startsWith(m)).reduce((s,r)=>s+r.la,0);return Math.round(fd+fl+(S-fd)/DAY()*dim(m))}

function cumChart(){const m=M,n=dim(m),{o}=daily(m),p=pm(m),po=daily(p).o,B=bud(m),O=sum(mt(m),'out'),P=proj(m),cur=m==CUR(),last=cur?DAY():n;

function dayBars(){const m=M,n=dim(m),{o,f}=daily(m),mx=Math.max(1,...o)*1.1,w=700,h=170,x0=48,bw=(w-x0-10)/n;let s=axisY(mx,h,x0,w-10);
const top=o.map((v,d)=>[v,d]).slice(1).sort((a,b)=>b[0]-a[0]).slice(0,2).map(x=>x[1]);
for(let d=1;d<=n;d++){const x=x0+(d-1)*bw+bw*.15,bwi=bw*.7,Y=v=>h-v/mx*(h-14);const fut=m==CUR()&&d>DAY();

function monthly(){const ms=MONTHS().slice().reverse(),rows=ms.map(m=>{const b=bud(m),o=sum(mt(m),'out');return {m,b,o,r:b.A-o}}),mx=Math.max(1,...rows.map(r=>Math.abs(r.r)));

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function go(){const pw=document.getElementById('pw').value;try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},key,b64(E.c));D=JSON.parse(new TextDecoder().decode(p));sessionStorage.setItem('k',pw);render()}catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않아요'}}

const W=n=>{n=Math.round(n);const a=Math.abs(n),s=n<0?'-':'';if(a>=1e8)return s+(a/1e8).toFixed(1)+'억';if(a>=1e4)return s+(a>=1e6?Math.round(a/1e4):(a/1e4).toFixed(1).replace(/\.0$/,''))+'만';return s+a.toLocaleString()};
const F=n=>Math.round(n).toLocaleString()+'원';const DOW='일월화수목금토';
let D,M,CF=null,SHOWALL=false;
const LV=x=>x.c=='생활비';
const mt=m=>D.T.filter(x=>x.d.startsWith(m)),mtB=m=>D.T.filter(x=>x.bm==m);
const sum=(a,io)=>a.filter(x=>x.io==io&&!LV(x)).reduce((s,x)=>s+x.a,0);
const byCat=(a,io='out')=>{const g={};a.filter(x=>x.io==io&&!LV(x)).forEach(x=>g[x.c]=(g[x.c]||0)+x.a);return Object.entries(g).sort((a,b)=>b[1]-a[1])};
const pm=m=>{let[y,mm]=m.split('-').map(Number);mm--;if(!mm){y--;mm=12}return y+'-'+String(mm).padStart(2,'0')};
const nm=m=>{let[y,mm]=m.split('-').map(Number);mm++;if(mm>12){y++;mm=1}return y+'-'+String(mm).padStart(2,'0')};
const CUR=()=>D.today.slice(0,7),DAY=()=>+D.today.slice(8),dim=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const MONTHS=()=>[...new Set(D.T.map(x=>x.d.slice(0,7)))].sort().filter(m=>m>='2025-12');
const ML=m=>+m.slice(5)+'월';
const dday=d=>{const n=Math.round((new Date(d)-new Date(D.today))/864e5);return n==0?'오늘':'D-'+n};
const LIFE=5500000;function bud(m){const a=mtB(m),I=a.filter(x=>x.io=='in').reduce((s,x)=>s+x.a,0),La=mt(m).filter(LV).reduce((s,x)=>s+x.a,0),L=LIFE;let X=0,xn=[];if(m==CUR())for(const c of['급여','육아수당'])if(!a.some(x=>x.c==c)){const p=mtB(pm(m)).filter(x=>x.c==c).reduce((s,x)=>s+x.a,0);if(p){X+=p;xn.push(c)}}return {I,L,La,X,xn,A:I+X-L}}
function proj(m){const a=mt(m),S=sum(a,'out');if(m!=CUR())return S;const fd=a.filter(x=>x.io=='out'&&x.f&&!LV(x)).reduce((s,x)=>s+x.a,0),fl=D.fix.filter(r=>!r.yr&&r.nx.startsWith(m)).reduce((s,r)=>s+r.la,0);return Math.round(fd+fl+(S-fd)/DAY()*dim(m))}
function daily(m){const n=dim(m),o=Array(n+1).fill(0),f=Array(n+1).fill(0);mt(m).filter(x=>x.io=='out'&&!LV(x)).forEach(x=>{const d=+x.d.slice(8);o[d]+=x.a;if(x.f)f[d]+=x.a});return {o,f}}
function balAt(m){let k=0,h=0;for(const x of MONTHS()){if(x>m)break;if(D.kbal[x]!=null)k=D.kbal[x];if(D.hbal[x]!=null)h=D.hbal[x]}return {k,h}}
const badge=(t,c='')=>`<span class="bd ${c}">${t}</span>`;
function axisY(mx,h,x0,x1){let s='';for(let i=0;i<=4;i++){const v=mx*i/4,y=h-v/mx*(h-14)-0.5;s+=`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" class="gl"/><text x="${x0-6}" y="${y+4}" class="al" text-anchor="end">${i?W(v):'0'}</text>`}return s}
function side(){const ms=MONTHS().slice().reverse(),B=bud(M),O=sum(mt(M),'out'),R=B.A-O,P=proj(M),bl=balAt(M);
return `<div class="card"><div class="sh">월 선택</div>${ms.map(m=>{const o=sum(mt(m),'out'),r=bud(m).A-o;return `<div class="mi ${m==M?'on':''}" onclick="M='${m}';SHOWALL=false;CF=null;draw()"><span>${m.slice(2,4)}년 ${ML(m)}</span><span class="mr">${W(o)} 씀 · <b class="${r<0?'neg':''}">${r<0?W(-r)+' 넘음':W(r)+' 남음'}</b></span></div>`}).join('')}</div>
<div class="card kp"><div class="k"><div class="kl">쓸 수 있는 돈</div><div class="kv">${W(B.A)}</div><div class="ks">들어온 ${W(B.I)}${B.X?` + 예정 ${W(B.X)}`:''} − 생활비 550만(가정)</div></div>
<div class="k"><div class="kl">쓴 돈</div><div class="kv">${W(O)}</div><div class="ks">생활비 송금은 빼고</div></div>
<div class="k"><div class="kl">남은 돈</div><div class="kv ${R<0?'neg':''}">${W(R)}</div>${R<0?badge('이미 넘었어','or'):''}</div>
${M==CUR()?`<div class="k"><div class="kl">말일 예상 지출</div><div class="kv">${W(P)}</div>${B.A-P<0?badge(W(P-B.A)+' 모자랄 듯','or'):badge(W(B.A-P)+' 남을 듯','ok')}</div>`:''}
<div class="k"><div class="kl">마이너스 통장 (${ML(M)} 말 기준)</div><div class="kv neg">${W(bl.k+bl.h)}</div><div class="ks">국민 ${W(bl.k)} · 하나 ${W(bl.h)}</div></div></div>`}
function alerts(){if(M!=CUR())return '';const c=Object.fromEntries(byCat(mt(M))),it=[];const B=bud(M),P=proj(M);
if(B.A-P<0)it.push(['예산','#','이대로면 말일에 '+W(P-B.A)+'원 모자라',`예상 지출 ${W(P)} / 쓸 수 있는 돈 ${W(B.A)}`]);
D.goals.forEach(([g,b])=>{const v=c[g]||0;if(v>b)it.push(['목표 초과',g,`${g} 목표 ${W(b)}에서 ${W(v-b)} 넘었어`,`지금 ${W(v)} · 이 속도면 말일 ${W(v/DAY()*dim(M))}`]);else if(v/DAY()*dim(M)>b)it.push(['주의',g,`${g} 이 속도면 목표 넘어`,`지금 ${W(v)} / 목표 ${W(b)}`])});
D.fix.filter(r=>{const n=(new Date(r.nx)-new Date(D.today))/864e5;return n>=0&&n<=7}).forEach(r=>it.push(['곧 출금',r.n,`${r.n} ${W(r.la)}원`,`${+r.nx.slice(5,7)}/${+r.nx.slice(8)} ${dday(r.nx)} · ${r.s}`]));
return `<div class="card"><div class="ch"><h3>확인할 것 · ${it.length}</h3><span class="ts">급한 것부터</span></div>${it.map(([b,n,t,s])=>`<div class="ar">${badge(b,b=='곧 출금'?'gr':'or')}<b>${t}</b><span class="ts">${s}</span></div>`).join('')||'<div class="ts">없어</div>'}</div>`}
function cumChart(){const m=M,n=dim(m),{o}=daily(m),p=pm(m),po=daily(p).o,B=bud(m),O=sum(mt(m),'out'),P=proj(m),cur=m==CUR(),last=cur?DAY():n;
const c=[0],pc=[0];for(let d=1;d<=n;d++){c[d]=c[d-1]+o[d]}for(let d=1;d<=dim(p);d++)pc[d]=pc[d-1]+po[d];
const mx=Math.max(B.A,P,pc.at(-1),O)*1.08||1,w=700,h=230,x0=48,X=d=>x0+(d/n)*(w-x0-110),Y=v=>h-v/mx*(h-14);
let s=axisY(mx,h,x0,w-110);for(let d=0;d<=n;d+=5)s+=`<text x="${X(d)}" y="${h+16}" class="al" text-anchor="middle">${d||1}일</text>`;
s+=`<polyline points="${pc.slice(0,n+1).map((v,d)=>X(Math.min(d,n))+','+Y(v)).join(' ')}" class="l2"/>`;
if(B.A>0)s+=`<line x1="${x0}" x2="${X(n)}" y1="${Y(B.A)}" y2="${Y(B.A)}" class="lb"/>`;
s+=`<polyline points="${c.slice(0,last+1).map((v,d)=>X(d)+','+Y(v)).join(' ')}" class="l1"/>`;
if(cur)s+=`<line x1="${X(last)}" y1="${Y(O)}" x2="${X(n)}" y2="${Y(P)}" class="lp"/><line x1="${X(last)}" x2="${X(last)}" y1="4" y2="${h}" class="tl"/><circle cx="${X(last)}" cy="${Y(O)}" r="3.5" fill="#1f2d3d"/>`;
const lab=[[Y(cur?P:O),(cur?'예상 ':'')+W(cur?P:O),'#1f2d3d'],[Y(pc[Math.min(n,dim(p))]),'지난달 '+W(pc.at(-1)),'#7f9bb5'],[Y(B.A),'쓸 수 있는 돈 '+W(B.A),'#c2410c']].sort((a,b)=>a[0]-b[0]);for(let i=1;i<lab.length;i++)if(lab[i][0]-lab[i-1][0]<14)lab[i][0]=lab[i-1][0]+14;
lab.forEach(([y,t,cl])=>s+=`<text x="${X(n)+8}" y="${y+4}" class="el" fill="${cl}">${t}</text>`);
const tt=cur?`${ML(m)}: ${W(B.A)} 중 ${W(O)} 썼고, 이대로면 ${B.A-P<0?W(P-B.A)+' 모자라':W(B.A-P)+' 남아'}`:`${ML(m)}: ${W(B.A)} 중 ${W(O)} 썼어 (${B.A-O<0?W(O-B.A)+' 넘음':W(B.A-O)+' 남음'})`;
return `<div class="card"><div class="ch"><h3>${tt}</h3></div><div class="lg"><span><i class="s1"></i>이번 달 누적</span><span><i class="s2"></i>지난달 누적</span>${cur?'<span><i class="s3"></i>예상</span>':''}<span><i class="s4"></i>쓸 수 있는 돈</span></div><svg viewBox="0 0 ${w} ${h+22}" class="ch1">${s}</svg></div>`}
function dayBars(){const m=M,n=dim(m),{o,f}=daily(m),mx=Math.max(1,...o)*1.1,w=700,h=170,x0=48,bw=(w-x0-10)/n;let s=axisY(mx,h,x0,w-10);
const top=o.map((v,d)=>[v,d]).slice(1).sort((a,b)=>b[0]-a[0]).slice(0,2).map(x=>x[1]);
for(let d=1;d<=n;d++){const x=x0+(d-1)*bw+bw*.15,bwi=bw*.7,Y=v=>h-v/mx*(h-14);const fut=m==CUR()&&d>DAY();
if(o[d]){s+=`<rect x="${x}" y="${Y(o[d])}" width="${bwi}" height="${h-Y(o[d])}" fill="#2f4050"><title>${d}일 ${F(o[d])}</title></rect>`;if(f[d])s+=`<rect x="${x}" y="${Y(f[d])}" width="${bwi}" height="${h-Y(f[d])}" fill="#9bb4cb"/>`}
if(fut)s+=`<rect x="${x}" y="${h-3}" width="${bwi}" height="3" fill="none" stroke="#c5ced8" stroke-dasharray="2 2"/>`;
if(top.includes(d)&&o[d])s+=`<text x="${x+bwi/2}" y="${Y(o[d])-5}" class="el" text-anchor="middle">${W(o[d])}</text>`;
if(d%2==1||n<20)s+=`<text x="${x+bwi/2}" y="${h+14}" class="al" text-anchor="middle">${d}</text>`}
const ds=o.slice(1).filter(v=>v).length;return `<div class="card"><div class="ch"><h3>하루 쓴 돈 · ${ML(m)} ${ds}일 동안 썼어</h3><span class="ts">하루 평균 ${W(sum(mt(m),'out')/(m==CUR()?DAY():n))}</span></div><div class="lg"><span><i style="background:#2f4050"></i>그때그때 쓴 돈</span><span><i style="background:#9bb4cb"></i>고정비</span></div><svg viewBox="0 0 ${w} ${h+20}">${s}</svg></div>`}
const PAL=['#1f2d3d','#3d566e','#5b7a99','#7f9bb5','#a3bccf','#c4d4e1','#dde6ee','#eef2f6'];
function cats(){const a=mt(M),O=sum(a,'out'),cs=byCat(a),pc=Object.fromEntries(byCat(mt(pm(M)))),top=cs.slice(0,7),rest=cs.slice(7).reduce((s,x)=>s+x[1],0);const seg=rest?[...top,['그 외',rest]]:top;
const dm=Math.max(1,...cs.map(([c,v])=>Math.abs(v-(pc[c]||0))));
return `<div class="card"><div class="ch"><h3>어디에 썼나 · ${cs[0]?`${cs[0][0]}가 ${Math.round(cs[0][1]/O*100)}%로 제일 커`:''}</h3><span class="ts">줄을 누르면 아래 내역이 걸러져</span></div><div class="lg">${seg.map(([c,v],i)=>`<span><i style="background:${PAL[i]}"></i>${c} <b>${W(v)}</b></span>`).join('')}</div><div class="sb">${seg.map(([c,v],i)=>`<div style="width:${v/O*100}%;background:${PAL[i]}" title="${c} ${F(v)}"></div>`).join('')}</div>
<table><thead><tr><th>카테고리</th><th class="r">${ML(M)}</th><th class="r">비중</th><th class="r">${ML(pm(M))}</th><th class="c">지난달보다</th><th class="r">변화</th></tr></thead><tbody>${cs.map(([c,v])=>{const d=v-(pc[c]||0);return `<tr class="ck ${CF==c?'on':''}" onclick="CF=CF=='${c}'?null:'${c}';draw();document.getElementById('tx').scrollIntoView({behavior:'smooth'})"><td><b>${c}</b></td><td class="r">${F(v)}</td><td class="r ts">${Math.round(v/O*100)}%</td><td class="r ts">${W(pc[c]||0)}</td><td class="c"><div class="dv"><div class="${d>0?'up':'dn'}" style="width:${Math.abs(d)/dm*50}%"></div></div></td><td class="r ${d>0?'neg':'pos'}"><b>${d>0?'+':''}${W(d)}</b></td></tr>`}).join('')}</tbody></table></div>`}
function heat(){const a=mt(M).filter(x=>x.io=='out'&&!LV(x)),n=dim(M),cs=byCat(mt(M)).slice(0,8).map(x=>x[0]),g={};a.forEach(x=>{const k=x.c+'|'+(+x.d.slice(8));g[k]=(g[k]||0)+x.a});
const vals=Object.values(g).sort((a,b)=>a-b),q=p=>vals[Math.floor(p*(vals.length-1))]||1,th=[q(.25),q(.5),q(.75),q(.92)],lv=v=>v?1+th.filter(t=>v>t).length:0;
const cnt=c=>a.filter(x=>x.c==c).length;
let h=`<div class="hm" style="grid-template-columns:110px 44px repeat(${n},1fr)"><div></div><div></div>${Array.from({length:n},(_,i)=>{const dt=new Date(M+'-'+String(i+1).padStart(2,'0'));return `<div class="hd ${dt.getDay()%6==0?'we':''}">${i+1}</div>`}).join('')}`;
cs.forEach(c=>{h+=`<div class="hl">${c}</div><div class="hn">${cnt(c)}건</div>`;for(let d=1;d<=n;d++){const v=g[c+'|'+d]||0,fut=M==CUR()&&d>DAY();h+=`<div class="hc l${lv(v)} ${fut?'fu':''}" title="${d}일 ${c} ${F(v)}">${v?(v>=1e4?(v/1e4).toFixed(v>=1e5?0:1):'·'):''}</div>`}});
return `<div class="card"><div class="ch"><h3>언제 뭘 썼나 · 카테고리 × 날짜</h3><span class="ts">칸 숫자는 만 원 · 진할수록 많이</span></div>${h}</div><div class="lg r"><span>적게</span>${[1,2,3,4,5].map(i=>`<i class="hc l${i}" style="width:14px;height:10px;display:inline-block"></i>`).join('')}<span>많이</span></div></div>`}
function monthly(){const ms=MONTHS().slice().reverse(),rows=ms.map(m=>{const b=bud(m),o=sum(mt(m),'out');return {m,b,o,r:b.A-o}}),mx=Math.max(1,...rows.map(r=>Math.abs(r.r)));
return `<div class="card"><div class="ch"><h3>월별 정리 · 그 달 급여 등 − 생활비 550만 − 쓴 돈 = 남은 돈</h3><span class="ts">월말 급여는 그 달 몫, 10일 전에 들어온 급여는 전달 몫</span></div><table><thead><tr><th>월</th><th class="r">들어온 돈</th><th class="r">실제 생활비 송금</th><th class="r">쓸 수 있는 돈</th><th class="r">쓴 돈</th><th class="c">남거나 넘은 돈</th><th class="r">남은 돈</th></tr></thead><tbody>${rows.map(r=>`<tr class="ck ${r.m==M?'on':''}" onclick="M='${r.m}';CF=null;draw();scrollTo({top:0,behavior:'smooth'})"><td><b>${r.m.slice(2,4)}년 ${ML(r.m)}</b></td><td class="r">${W(r.b.I)}${r.b.X?`<span class="ts"> +${W(r.b.X)}</span>`:''}</td><td class="r ts">${W(r.b.La)}</td><td class="r">${W(r.b.A)}</td><td class="r">${W(r.o)}</td><td class="c"><div class="dv"><div class="${r.r<0?'up':'dn2'}" style="width:${Math.abs(r.r)/mx*50}%"></div></div></td><td class="r ${r.r<0?'neg':''}"><b>${r.r>0?'+':''}${W(r.r)}</b></td></tr>`).join('')}</tbody></table><div class="ts" style="margin-top:8px">3월 들어온 돈에는 가족에게 받은 1,720만 원(차 할부 일시 상환용)이 들어 있어.</div></div>`}
function fixed(){const tot=D.fix.reduce((s,r)=>s+r.mo,0);return `<div class="card"><div class="ch"><h3>고정비 · 매달 ${W(tot)}, 1년이면 ${W(tot*12)}</h3><span class="ts">다음 출금일 순</span></div><table><thead><tr><th>항목</th><th>어디서</th><th class="r">한 달 기준</th><th class="r">최근 출금</th><th>다음 출금</th></tr></thead><tbody>${[...D.fix].sort((a,b)=>a.nx<b.nx?-1:1).map(r=>{const n=Math.round((new Date(r.nx)-new Date(D.today))/864e5);return `<tr><td><b>${r.n}</b>${r.yr?' '+badge('연 1회','gr'):''}</td><td class="ts">${r.s}</td><td class="r">${F(r.mo)}</td><td class="r ts">${F(r.la)}</td><td>${+r.nx.slice(5,7)}/${+r.nx.slice(8)} ${badge(dday(r.nx),n<=7?'or':'gr')}</td></tr>`}).join('')}</tbody></table></div>`}
function goals(){if(M!=CUR())return '';const c=Object.fromEntries(byCat(mt(M)));return `<div class="card"><div class="sh">절약 목표 (${ML(M)})</div>${D.goals.map(([g,b])=>{const v=c[g]||0,r=Math.min(100,v/b*100);return `<div class="gl2"><div class="gt"><span>${g}</span><span class="ts">${W(v)} / ${W(b)}</span></div><div class="gb"><div style="width:${r}%;background:${v>b?'#c2410c':'#3d566e'}"></div></div></div>`}).join('')}</div>`}
function txs(){let a=mt(M).filter(x=>!CF||x.c==CF).slice().sort((x,y)=>x.d<y.d?1:x.d>y.d?-1:0);const tot=a.reduce((s,x)=>s+(x.io=='out'&&!LV(x)?x.a:0),0),shown=SHOWALL?a:a.slice(0,40);
return `<div class="card" id="tx"><div class="ch"><h3>내역 · ${a.length}건${CF?` (${CF}, ${F(tot)})`:''}</h3>${CF?`<button class="btn" onclick="CF=null;draw()">필터 지우기</button>`:'<span class="ts">최신순</span>'}</div><table><thead><tr><th>날짜</th><th>어디서</th><th>카테고리</th><th>출처</th><th class="r">금액</th></tr></thead><tbody>${shown.map(x=>{const dt=new Date(x.d);return `<tr class="${LV(x)?'lv':''}"><td class="ts">${+x.d.slice(5,7)}/${+x.d.slice(8)} ${DOW[dt.getDay()]}</td><td><b>${x.m}</b>${x.bm!=x.d.slice(0,7)?' '+badge(ML(x.bm)+' 몫','gr'):''}</td><td>${LV(x)?badge('생활비 · 쓴 돈 제외','gr'):x.c}</td><td class="ts">${x.s}</td><td class="r ${x.io=='in'?'pos':''}"><b>${x.io=='in'?'+':'-'}${x.a.toLocaleString()}</b></td></tr>`}).join('')}</tbody></table>${!SHOWALL&&a.length>40?`<button class="btn" onclick="SHOWALL=true;draw()">${a.length}건 모두 보기</button>`:''}</div>`}
function draw(){document.getElementById('side').innerHTML=side()+goals();document.getElementById('main').innerHTML=alerts()+cumChart()+dayBars()+cats()+heat()+monthly()+fixed()+txs();document.getElementById('ttl').textContent=`${M.slice(0,4)}년 ${ML(M)}`}
function render(){document.getElementById('lock').style.display='none';const a=document.getElementById('app');a.style.display='';const tdt=new Date(D.today);
a.innerHTML=`<header><div class="hw"><b class="brand">✱ 가계부</b><span class="sp"></span><span class="tp">오늘 · ${+D.today.slice(5,7)}/${+D.today.slice(8)} ${DOW[tdt.getDay()]}</span><span class="ts">국민·하나·국민카드 기준</span></div></header><div class="wrap"><h1 id="ttl"></h1><div class="sub ts">쓸 수 있는 돈은 그 달 말에 들어올 급여와 그 달 수당 등에서 생활비 550만 원을 뺀 금액이야. 생활비 송금은 쓴 돈에서 빼.</div><div class="grid"><aside id="side"></aside><main id="main"></main></div></div>`;
D.T.forEach(x=>{x.bm=(x.c=='급여'&&+x.d.slice(8)<=10)?pm(x.d.slice(0,7)):x.d.slice(0,7)});M=CUR();draw()}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function go(){const pw=document.getElementById('pw').value;try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},key,b64(E.c));D=JSON.parse(new TextDecoder().decode(p));sessionStorage.setItem('k',pw);render()}catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않아요'}}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key=='Enter')go()});
if(sessionStorage.getItem('k')){document.getElementById('pw').value=sessionStorage.getItem('k');go()}
</script></body></html>

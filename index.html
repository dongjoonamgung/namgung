const W=n=>{n=Math.round(n);const a=Math.abs(n),s=n<0?'-':'';if(a>=1e8)return s+(a/1e8).toFixed(1)+'억';if(a>=1e4)return s+(a>=1e6?Math.round(a/1e4):(a/1e4).toFixed(1).replace(/\.0$/,''))+'만';return s+a.toLocaleString()};

const LV=x=>x.c=='생활비';
const mt=m=>D.T.filter(x=>x.d.startsWith(m)),mtB=m=>D.T.filter(x=>x.bm==m);

const byCat=(a,io='out')=>{const g={};a.filter(x=>x.io==io&&!LV(x)).forEach(x=>g[x.c]=(g[x.c]||0)+x.a);return Object.entries(g).sort((a,b)=>b[1]-a[1])};
const pm=m=>{let[y,mm]=m.split('-').map(Number);mm--;if(!mm){y--;mm=12}return y+'-'+String(mm).padStart(2,'0')};
const nm=m=>{let[y,mm]=m.split('-').map(Number);mm++;if(mm>12){y++;mm=1}return y+'-'+String(mm).padStart(2,'0')};
const CUR=()=>D.today.slice(0,7),DAY=()=>+D.today.slice(8),dim=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const MONTHS=()=>[...new Set(D.T.map(x=>x.d.slice(0,7)))].sort().filter(m=>m>='2025-12');
const ML=m=>+m.slice(5)+'월';
const dday=d=>{const n=Math.round((new Date(d)-new Date(D.today))/864e5);return n==0?'오늘':'D-'+n};
const LIFE=5500000;function bud(m){const a=mtB(m),I=a.filter(x=>x.io=='in').reduce((s,x)=>s+x.a,0),La=mt(m).filter(LV).reduce((s,x)=>s+x.a,0),L=LIFE;let X=0,xn=[];if(m==CUR())for(const c of['급여','육아수당'])if(!a.some(x=>x.c==c)){const p=mtB(pm(m)).filter(x=>x.c==c).reduce((s,x)=>s+x.a,0);if(p){X+=p;xn.push(c)}}return {I,L,La,X,xn,A:I+X-L}}
function proj(m){const a=mt(m),S=sum(a,'out');if(m!=CUR())return S;const fd=a.filter(x=>x.io=='out'&&x.f&&!LV(x)).reduce((s,x)=>s+x.a,0),fl=D.fix.filter(r=>!r.yr&&r.nx.startsWith(m)).reduce((s,r)=>s+r.la,0);return Math.round(fd+fl+(S-fd)/DAY()*dim(m))}
function daily(m){const n=dim(m),o=Array(n+1).fill(0),f=Array(n+1).fill(0);mt(m).filter(x=>x.io=='out'&&!LV(x)).forEach(x=>{const d=+x.d.slice(8);o[d]+=x.a;if(x.f)f[d]+=x.a});return {o,f}}

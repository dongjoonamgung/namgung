const W=n=>{n=Math.round(n);const a=Math.abs(n);return (n<0?'-':'')+(a>=10000?(a/10000).toFixed(a>=1e6?0:1).replace(/\.0$/,'')+'만':a.toLocaleString())};
const won=n=>Math.round(n).toLocaleString()+'원';
const el=(h)=>{const t=document.createElement('div');t.innerHTML=h;return t};
const COL=['#3b82f6','#f59e0b','#14b8a6','#ef4444','#8b5cf6','#ec4899','#22c55e','#64748b','#0ea5e9','#eab308','#a855f7','#f97316','#84cc16','#06b6d4'];
let D;
function card(v,l,d,cls=''){return `<div class="c"><div class="v ${cls}">${v}</div><div class="l">${l}</div>${d?`<div class="d">${d}</div>`:''}</div>`}
function groups(tx,io){const g={};tx.filter(x=>x.io==io).forEach(x=>{g[x.c]=(g[x.c]||0)+x.a});return Object.entries(g).sort((a,b)=>b[1]-a[1])}
function bars(arr,max){max=max||Math.max(1,...arr.map(a=>a[1]));return arr.map(([n,v],i)=>`<div class="bar"><span class="n">${n}</span><div class="t" style="width:${Math.max(2,v/max*60)}%;background:${COL[i%COL.length]}"></div><span>${W(v)}</span></div>`).join('')}
function txtable(tx,lim){if(!tx.length)return '<p class="s">거래 없음</p>';return `<table><tr><th>날짜</th><th>어디</th><th>분류</th><th class="r">금액</th></tr>${tx.slice(0,lim||999).map(x=>`<tr><td>${x.d.slice(5)} ${x.t||''}</td><td>${x.m}<span class="d"> · ${x.s}</span></td><td>${x.c}</td><td class="r ${x.io=='in'?'pos':''}">${x.io=='in'?'+':'-'}${x.a.toLocaleString()}</td></tr>`).join('')}</table>`}
function sumIO(tx){let o=0,i=0;tx.forEach(x=>x.io=='out'?o+=x.a:i+=x.a);return [o,i]}
function tabDay(){const t=D.tx.filter(x=>x.d==D.today),w=D.tx.filter(x=>x.d>=D.week&&x.d<=D.today);const [to,ti]=sumIO(t),[wo,wi]=sumIO(w);
return `<div class="g">${card(W(to),'오늘 나간 돈',D.today.slice(5).replace('-','/')+' 기준')}${card(W(ti),'오늘 들어온 돈')}${card(W(wo),'이번 주 나간 돈',D.week.slice(5).replace('-','/')+'부터')}${card(W(wi),'이번 주 들어온 돈')}</div>
<h2>이번 주 어디에 썼나</h2><div class="box">${bars(groups(w,'out'))||'<p class="s">없음</p>'}</div>
<h2>오늘 거래</h2>${txtable(t)}<h2>이번 주 거래</h2>${txtable(w)}`}
function tabMonth(){const P=D.proj,diff=P.p-P.prev;const cats=[...new Set([...Object.keys(D.cur),...Object.keys(D.prevsame)])].sort((a,b)=>(D.cur[b]||0)-(D.cur[a]||0));
const mt=D.tx.filter(x=>x.d.slice(0,7)==D.today.slice(0,7));const [mo,mi]=sumIO(mt);
return `<div class="hl ${diff>0?'bad':'good'}">이대로 가면 이번 달 지출은 약 <b>${W(P.p)}</b>, 지난달(${W(P.prev)})보다 <b>${W(Math.abs(diff))} ${diff>0?'더 쓰는':'덜 쓰는'}</b> 중이야.</div>
<div class="g">${card(W(mo),'이번 달 나간 돈','1일~'+(+D.today.slice(8))+'일')}${card(W(mi),'이번 달 들어온 돈')}${card(W(P.p),'말일 예상 지출','남은 고정비 '+W(P.fl)+' + 변동 지출 속도 반영')}${card(W(mi-mo),'이번 달 남은 돈',(mi-mo<0?'적자':'흑자'),mi-mo<0?'neg':'')}</div>
<h2>항목별: 이번 달 vs 지난달 같은 기간</h2><table><tr><th>분류</th><th class="r">이번 달(1~${+D.today.slice(8)}일)</th><th class="r">지난달 같은 기간</th><th class="r">차이</th><th class="r">말일 예상</th><th class="r">지난달 전체</th></tr>
${cats.map(c=>{const a=D.cur[c]||0,b=D.prevsame[c]||0,d=a-b;return `<tr><td>${c}</td><td class="r">${W(a)}</td><td class="r">${W(b)}</td><td class="r ${d>0?'neg':'pos'}">${d>0?'+':''}${W(d)}</td><td class="r">${W(D.catproj[c]||0)}</td><td class="r">${W((D.mon[D.months[D.months.length-2]].o[c])||0)}</td></tr>`}).join('')}</table>
<h2>들어온 돈 묶음</h2><div class="box">${bars(groups(mt,'in'))||'<p class="s">없음</p>'}</div>
<h2>눈여겨볼 지출</h2><p class="s">이번 달 10만 원 넘는 지출이나 처음 보는 가맹점이야.</p>${txtable(D.big)}
<h2>이번 달 전체 거래</h2>${txtable(mt)}`}
function chart(series,keys,labels,colors){const H=220,Wd=Math.max(560,D.months.length*60),n=D.months.length,bw=(Wd-40)/n;const mx=Math.max(1,...series.flatMap(s=>keys.map(k=>s[k]||0)));
let s=`<svg viewBox="0 0 ${Wd} ${H+30}" style="width:100%"><line x1="30" y1="${H}" x2="${Wd}" y2="${H}" stroke="#ddd"/>`;
[0,.5,1].forEach(f=>{s+=`<text x="0" y="${H-H*f*0.9+4}" font-size="10" fill="#999">${W(mx*f)}</text>`});
series.forEach((r,i)=>{keys.forEach((k,j)=>{const h=(r[k]||0)/mx*H*0.9,x=34+i*bw+j*(bw-8)/keys.length;s+=`<rect x="${x}" y="${H-h}" width="${(bw-10)/keys.length}" height="${h}" rx="2" fill="${colors[j]}"><title>${labels[j]} ${W(r[k]||0)}</title></rect>`});s+=`<text x="${34+i*bw+bw/2-8}" y="${H+16}" font-size="11" fill="#666">${+r.m.slice(5)}월</text>`});
return `<div class="lg">${labels.map((l,j)=>`<span><i style="background:${colors[j]}"></i>${l}</span>`).join('')}</div>${s}</svg>`}
function tabTrend(){const S=D.months.map(m=>({m,I:D.mon[m].I,O:D.mon[m].O,N:D.mon[m].I-D.mon[m].O}));const cats=Object.entries(D.months.reduce((a,m)=>{Object.entries(D.mon[m].o).forEach(([c,v])=>a[c]=(a[c]||0)+v);return a},{})).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
const B=D.bal.map(b=>({m:b.m,k:-(b.k||0),h:-(b.h||0)}));
return `<h2>월별 들어온 돈·나간 돈</h2><div class="box">${chart(S,['I','O'],['들어온 돈','나간 돈'],['#3b82f6','#f59e0b'])}<p class="s">11월은 ${+D.today.slice(8)}일까지야. 3월 지출엔 자동차 일시금이 들어 있어.</p></div>
<h2>월별 남은 돈</h2><table><tr><th>월</th><th class="r">들어온 돈</th><th class="r">나간 돈</th><th class="r">남은 돈</th></tr>${S.map(r=>`<tr><td>${r.m}</td><td class="r">${W(r.I)}</td><td class="r">${W(r.O)}</td><td class="r ${r.N<0?'neg':'pos'}">${W(r.N)}</td></tr>`).join('')}</table>
<h2>항목별 월 지출</h2><div style="overflow-x:auto"><table><tr><th>분류</th>${D.months.map(m=>`<th class="r">${+m.slice(5)}월</th>`).join('')}</tr>${cats.map(c=>`<tr><td>${c}</td>${D.months.map(m=>`<td class="r">${D.mon[m].o[c]?W(D.mon[m].o[c]):'-'}</td>`).join('')}</tr>`).join('')}</table></div>
<h2>마이너스 통장 잔액 (월말)</h2><div class="box">${chart(B,['k','h'],['국민 마이너스','하나 마이너스'],['#ef4444','#8b5cf6'])}<p class="s">막대가 높을수록 빚이 많은 거야. 지금 국민 ${W(D.bal.at(-1).k)}, 하나 ${W(D.bal.at(-1).h)}.</p></div>`}
function tabFix(){const t=D.today;const nx=r=>{let d=r.nx;if(d<=t){const x=new Date(d);x.setMonth(x.getMonth()+1);d=x.toISOString().slice(0,10)}return d};
return `<div class="g">${card(W(D.fixT),'월 고정비','숨만 쉬어도 나가는 돈')}${card(W(D.fixT*12),'1년 환산')}</div>
<h2>고정비 목록</h2><table><tr><th>항목</th><th>어디서</th><th class="r">월 금액</th><th>최근 출금</th><th>다음 예정</th></tr>${D.fix.map(r=>`<tr><td>${r.n}${r.yr?' <span class="tag">연 1회 '+W(r.la)+'</span>':''}</td><td>${r.s}</td><td class="r">${won(r.mo)}</td><td>${r.last.slice(2)}</td><td>${nx(r).slice(2)}</td></tr>`).join('')}</table>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function go(){const pw=document.getElementById('pw').value;try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},key,b64(E.c));D=JSON.parse(new TextDecoder().decode(p));sessionStorage.setItem('k',pw);render()}catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않아요'}}

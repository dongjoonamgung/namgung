function showCum(svg,cx,cy){const S=cumScale(M),{n,w,h,x0,rm,X,Y,c,pc,pN,cur,last,B,O,P}=S,r=svg.getBoundingClientRect(),sx=(cx-r.left)/Math.max(1,r.width)*w;let d=Math.round((sx-x0)/(w-x0-rm)*n);d=Math.max(1,Math.min(n,d));
const g=svg.querySelector('.cguide'),fut=cur&&d>last,Xd=X(d),pcv=pc[Math.min(d,pN)]||0;
if(g){g.style.display='block';const ln=g.querySelector('.cg-line');ln.setAttribute('x1',Xd);ln.setAttribute('x2',Xd);const now=g.querySelector('.cg-now'),pr=g.querySelector('.cg-prev'),pd=g.querySelector('.cg-pred');
if(fut){const pred=last==n?O:Math.round(O+(P-O)*(d-last)/(n-last));now.style.display='none';pd.style.display='block';pd.setAttribute('cx',Xd);pd.setAttribute('cy',Y(pred));}else{pd.style.display='none';now.style.display='block';now.setAttribute('cx',Xd);now.setAttribute('cy',Y(c[d]||0));}
if(pcv||d<=pN){pr.style.display='block';pr.setAttribute('cx',Xd);pr.setAttribute('cy',Y(pcv))}else pr.style.display='none'}
const ds=M+'-'+String(d).padStart(2,'0'),dt=new Date(ds+'T12:00:00');

if(fut){const pred=last==n?O:Math.round(O+(P-O)*(d-last)/(n-last)),rem=B.A-pred;
html+=`<span>예상 누적 ${W(pred)}</span></div><div class="tr"><span class="tn">쓸 수 있는 돈</span><b>${W(B.A)}</b></div><div class="tr"><span class="tn">이대로면</span><b class="${rem<0?'neg':''}">${rem<0?W(-rem)+' 부족':W(rem)+' 남음'}</b></div>`;
if(pN)html+=`<div class="tr"><span class="tn">지난달 같은 날</span><b>${W(pcv)}</b></div>`}
else{const a=D.T.filter(x=>x.d==ds&&x.io=='out'&&!LV(x)).sort((x,y)=>y.a-x.a),tot=a.reduce((s,x)=>s+x.a,0),cum=c[d]||0,diff=cum-pcv;
html+=`<span>${a.length?F(tot)+` · ${a.length}건`:'쓴 내역 없음'}</span></div><div class="tr"><span class="tn">이번 달 누적</span><b>${W(cum)}</b></div><div class="tr"><span class="tn">지난달 같은 날</span><b>${W(pcv)}${cum||pcv?` <em>(${diff>0?'+':''}${W(diff)})</em>`:''}</b></div>`;
const cg={};a.forEach(x=>{const k=x.c;(cg[k]=cg[k]||{a:0,n:0}).a+=x.a;cg[k].n++});
const cats=Object.entries(cg).sort((x,y)=>y[1].a-x[1].a);
if(cats.length)html+=`<div class="tg">`+cats.map(([k,v])=>`<div class="tr"><span class="tn">${esc(k)}</span><b>${F(v.a)} · ${v.n}건</b></div>`).join('')+'</div>';
const sh=a.slice(0,8);
if(sh.length)html+=sh.map(x=>`<div class="tr"><span class="tm">${x.t||''}</span><span class="tn">${esc(x.m)}${x.f?' <em>고정비</em>':''}</span><b>${x.a.toLocaleString()}</b></div>`).join('');
if(a.length>8)html+=`<div class="tm" style="margin-top:4px">외 ${a.length-8}건</div>`}
t.innerHTML=html;t.style.display='block';pos(cx,cy);return true}

function show(el,x,y){const d=+el.dataset.hd,c=el.dataset.hc,ds=M+'-'+String(d).padStart(2,'0'),dt=new Date(ds);
const a=D.T.filter(x=>x.d==ds&&x.io=='out'&&!LV(x)&&(!c||KY(x)==c)).sort((x,y)=>y.a-x.a);if(!a.length){hide();return false}const tot=a.reduce((s,x)=>s+x.a,0),sh=a.slice(0,12);
t.innerHTML=`<div class="th"><b>${+ds.slice(5,7)}/${d} ${DOW[dt.getDay()]}${c?' · '+c:''}</b><span>${F(tot)}${a.length>1?` · ${a.length}건`:''}</span></div>${sh.map(x=>`<div class="tr"><span class="tm">${x.t||''}</span><span class="tn">${x.m}${c?'':`<em>${x.c}</em>`}${x.f?' <em>고정비</em>':''}</span><b>${x.a.toLocaleString()}</b></div>`).join('')}${a.length>12?`<div class="tm" style="margin-top:4px">외 ${a.length-12}건</div>`:''}`;t.style.display='block';pos(x,y);return true}
function showNut(el,x,y){const ds=el.dataset.nd,dt=new Date(ds+'T12:00:00'),ps=NPS(),rec=NL[ds]||{};if(ds>NTODAY()){hide();return false}const xd=nutDay(ds);
t.innerHTML=`<div class="th"><b>${+ds.slice(5,7)}/${+ds.slice(8)} ${DOW[dt.getDay()]}</b><span>${Object.keys(rec).length?xd.tkD+'/'+xd.exD+' 회':'기록 없음'}</span></div>`+ps.map(p=>{const n=nTimes(p),v=nVal(rec[p.id],n),lab=v.skip?'스킵':v.done?(n>1?n+'/'+n+' 완료':'먹음'):v.k?v.k+'/'+n:'—';return `<div class="tr"><span class="tn">${esc(p.short||p.name)}</span><b>${lab}</b></div>`}).join('');t.style.display='block';pos(x,y);return true}
document.addEventListener('mouseover',e=>{if(Date.now()-tt<800)return;const n=e.target.closest('[data-nd]');if(n){showNut(n,e.clientX,e.clientY);return}const cum=e.target.closest('svg.ch1');if(cum){showCum(cum,e.clientX,e.clientY);return}const el=e.target.closest('[data-hd]');if(!el){hide();return}show(el,e.clientX,e.clientY)});

function pos(cx,cy){const r=t.getBoundingClientRect();let x=cx+14,y=cy+14;if(x+r.width>innerWidth-8)x=cx-r.width-14;if(y+r.height>innerHeight-8)y=cy-r.height-14;x=Math.max(8,Math.min(x,innerWidth-r.width-8));t.style.left=x+'px';t.style.top=Math.max(8,y)+'px'}}
function planCats(m){const c=CUR(),m3=[pm(pm(pm(c))),pm(pm(c)),pm(c)],P=D.plan||{},g={};if(!m)m=c;
D.T.forEach(x=>{if(x.io!='out'||LV(x))return;const mm=x.d.slice(0,7),i=m3.indexOf(mm);const k=x.c+'|'+x.sc;if(!g[k])g[k]={c:x.c,sc:x.sc,v:[0,0,0],n:0,f:0,now:0};const r=g[k];if(i>=0){r.v[i]+=x.a;r.n++;if(x.f)r.f++}if(mm==m)r.now+=x.a});
const rows=Object.values(g).map(r=>{r.avg=(r.v[0]+r.v[1]+r.v[2])/3;const p=P[r.sc];r.tg=p&&p[0]!=null?Math.min(p[0],r.avg):r.avg;r.tip=p?p[1]:'';r.sv=r.avg-r.tg;r.ty=r.f>=r.n/2&&r.f>0?'고정':r.n/3>=4?'자주':'가끔';return r}).filter(r=>r.avg>0||r.now>0);
const byC={};rows.forEach(r=>{(byC[r.c]=byC[r.c]||[]).push(r)});const cs=Object.entries(byC).map(([cat,a])=>({c:cat,a:a.sort((x,y)=>y.avg-x.avg),avg:a.reduce((s,r)=>s+r.avg,0),tg:a.reduce((s,r)=>s+r.tg,0),now:a.reduce((s,r)=>s+r.now,0)})).sort((x,y)=>y.avg-x.avg);
const TA=cs.reduce((s,x)=>s+x.avg,0),TT=cs.reduce((s,x)=>s+x.tg,0),SV=TA-TT,FX=rows.filter(r=>r.ty=='고정').reduce((s,r)=>s+r.avg,0);
return {c,m3,P,rows,cs,TA,TT,SV,FX}}
function Wm(n){n=Math.round(n);const a=Math.abs(n),s=n<0?'-':'';return s+(a/1e4).toFixed(1)+'만'}
function useVsPlan(){const cur=CUR();const ms=[...new Set([...MONTHS(),cur])].filter(m=>m<=cur).sort();if(!BM||BM>cur||!ms.includes(BM))BM=cur;
const {cs,TT}=planCats(BM),nowT=cs.reduce((s,x)=>s+x.now,0),mx=Math.max(1,...cs.map(x=>Math.max(x.tg,x.now)))*1.05,mxT=Math.max(1,TT,nowT)*1.05;
const isCur=BM==cur,pace=isCur?DAY()/dim(BM):1,i=ms.indexOf(BM);
const nav=`<div class="ndnav"><button type="button" class="btn" ${i<=0?'disabled':''} onclick="BM=msPrev(BM);draw()" aria-label="이전 달">‹</button><select id="bmsel" onchange="BM=this.value;draw()">${ms.map(m=>`<option value="${m}" ${m==BM?'selected':''}>${m.slice(0,4)}년 ${ML(m)}</option>`).join('')}</select><button type="button" class="btn" ${i>=ms.length-1?'disabled':''} onclick="BM=msNext(BM);draw()" aria-label="다음 달">›</button></div>`;
const line=(now,tg)=>{const pct=tg?now/tg*100:now?100:0,over=now>tg;return `<span class="bva">${Wm(now)}</span><span class="bvs">/ ${Wm(tg)}</span><span class="bvp${over?' over':''}">${Math.round(pct)}%</span><span class="bvr${over?' over':''}"><i>${over?'초과':'남음'}</i><b>${Wm(over?now-tg:tg-now)}</b></span>`};
const bar=(now,tg,m)=>{const over=now>tg,tw=tg/m*100,fw=now/m*100,pmk=isCur?`<div class="bpace" style="left:${pace*tw}%" title="오늘까지 예상 ${Math.round(pace*100)}%"></div>`:'';return `<div class="bt">${pmk}<div class="b1" style="width:${tw}%"></div><div class="bf${over?' over':''}" style="width:${fw}%"></div></div>`};
const rows=cs.map(x=>`<div class="bb use"><div class="bn">${x.c}</div>${bar(x.now,x.tg,mx)}<div class="bv">${line(x.now,x.tg)}</div></div>`).join('');
const total=`<div class="bb use tot"><div class="bn">합계</div>${bar(nowT,TT,mxT)}<div class="bv">${line(nowT,TT)}</div></div>`;
const sub=isCur?`${ML(BM)} ${DAY()}일까지 · 경과 ${Math.round(pace*100)}% 기준, 생활비 빼고`:`${ML(BM)} 한 달 전체, 생활비 빼고`;
return `<div class="card"><div class="ch"><h3>이번 달 · 제안 대비 사용</h3>${nav}</div><div class="lg"><span><i style="background:#c5ced8"></i>제안</span><span><i style="background:#1f2d3d"></i>사용</span><span><i style="background:#c2410c"></i>초과</span>${isCur?`<span><i class="s3"></i>오늘까지 예상 페이스</span>`:''}</div><div class="ts" style="margin-bottom:8px">${sub}</div>${rows}${total}</div>`}
function msPrev(m){const cur=CUR(),ms=[...new Set([...MONTHS(),cur])].filter(x=>x<=cur).sort(),i=ms.indexOf(m);return i>0?ms[i-1]:m}
function msNext(m){const cur=CUR(),ms=[...new Set([...MONTHS(),cur])].filter(x=>x<=cur).sort(),i=ms.indexOf(m);return i>=0&&i<ms.length-1?ms[i+1]:m}
function budget(){const {c,m3,P,rows,cs,TA,TT,SV,FX}=planCats(CUR());
const top=rows.filter(r=>r.sv>0).sort((x,y)=>y.sv-x.sv);const B=bud(c);
const k=(t,v,s)=>`<div class="card bk"><div class="ts">${t}</div><div class="kv">${v}</div><div class="ts">${s}</div></div>`;
const mx=Math.max(1,...cs.map(x=>x.avg))*1.05;
const chart=`<div class="card"><div class="ch"><h3>비목별 · 지금 평균과 제안</h3><span class="ts">${m3.map(ML).join('·')} 평균, 생활비 빼고</span></div><div class="lg"><span><i style="background:#c5ced8"></i>최근 3개월 평균</span><span><i style="background:#1f2d3d"></i>제안</span></div>${cs.map(x=>`<div class="bb"><div class="bn">${x.c}</div><div class="bt"><div class="b1" style="width:${x.avg/mx*100}%"></div><div class="b2" style="width:${x.tg/mx*100}%"></div></div><div class="bv">${W(x.avg)} → <b>${W(x.tg)}</b>${x.avg-x.tg>500?` <span class="pos">−${W(x.avg-x.tg)}</span>`:''}</div></div>`).join('')}</div>`;
const tipc=`<div class="card"><div class="ch"><h3>이렇게 바꾸면 · 한 달 ${W(SV)}, 1년 ${W(SV*12)} 아껴</h3><span class="ts">아끼는 돈이 큰 순서</span></div><table><thead><tr><th>세목</th><th class="r">지금 평균</th><th class="r">제안</th><th class="r">한 달 절약</th><th>어떻게</th></tr></thead><tbody>${top.map(r=>`<tr><td><b>${r.sc}</b> <span class="ts">${r.c}</span></td><td class="r">${W(r.avg)}</td><td class="r"><b>${W(r.tg)}</b></td><td class="r pos"><b>−${W(r.sv)}</b></td><td class="ts tw">${esc(r.tip)}</td></tr>`).join('')}</tbody></table></div>`;
const tbl=`<div class="card"><div class="ch"><h3>세목별 예산 · ${ML(c)}은 지금까지 얼마 썼나</h3><span class="ts">고정은 매달 자동으로 나가는 것, 자주는 한 달 4번 넘게 쓰는 것</span></div><table><thead><tr><th>세목</th><th>성격</th><th class="r">한 달 횟수</th>${m3.map(m=>`<th class="r">${ML(m)}</th>`).join('')}<th class="r">평균</th><th class="r">제안</th><th>${ML(c)} 지금까지</th></tr></thead><tbody>${cs.map(x=>`<tr class="gh"><td colspan="3"><b>${x.c}</b></td><td colspan="3"></td><td class="r"><b>${W(x.avg)}</b></td><td class="r"><b>${W(x.tg)}</b></td><td>${pb(x.now,x.tg)}</td></tr>`+x.a.map(r=>`<tr><td style="padding-left:18px">${r.sc}${r.tip&&r.sv<=0?` <span class="ts" title="${esc(r.tip)}">ⓘ</span>`:''}</td><td>${badge(r.ty,r.ty=='고정'?'gr':r.ty=='자주'?'or':'gr')}</td><td class="r ts">${(r.n/3).toFixed(1)}</td>${r.v.map(v=>`<td class="r ts">${v?W(v):'-'}</td>`).join('')}<td class="r">${W(r.avg)}</td><td class="r">${r.sv>0?`<b>${W(r.tg)}</b>`:`<span class="ts">${W(r.tg)}</span>`}</td><td>${pb(r.now,r.tg,r.sv<=0)}</td></tr>`).join('')).join('')}</tbody></table><div class="ts" style="margin-top:8px">${esc((P['확인 필요']||[])[1]||'')}</div></div>`;
return `<div class="kg">${k('최근 3개월 한 달 평균',W(TA),`고정 ${W(FX)} 포함, 생활비 빼고`)}${k('제안대로 쓰면',W(TT),`${ML(c)} 쓸 수 있는 돈 ${W(B.A)}`)}${k('한 달에 아끼는 돈',`<span class="pos">${W(SV)}</span>`,`1년이면 ${W(SV*12)}`)}</div>`+tipc+chart+useVsPlan()+tbl}
function pb(v,t,nu){if(!t&&!v)return '<span class="ts">-</span>';const r=t?Math.min(100,v/t*100):100,o=v>t&&!nu;return `<div class="pg"><div class="gb"><div style="width:${r}%;background:${o?'#c2410c':'#3d566e'}"></div></div><span class="ts ${o?'neg':''}">${W(v)}</span></div>`}

function txAsOf(){let d=D.today||'';(D.T||[]).forEach(x=>{if(x.d&&x.d>d)d=x.d});return d}
function txAsOfLab(){const d=txAsOf();return d?`거래 반영: ~${+d.slice(5,7)}/${+d.slice(8)}`:''}
function NTODAY(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function nadd(d,k){const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+k);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function NPS(){return (D.nut&&D.nut.products)||[]}
function NPAL(i){return ['#1f2d3d','#5b7c99','#f2541b','#7f9bb5','#c2410c','#3d566e'][i%6]}
async function saveNL(){try{if(!KEY)return;const iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify({log:NL,st:ST})));localStorage.setItem('nut',JSON.stringify({i:u64(iv),c:u64(new Uint8Array(c))}))}catch(e){}}
async function loadNL(){let loc={};try{const v=JSON.parse(localStorage.getItem('nut')||'null');if(v&&KEY){const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(v.i)},KEY,b64(v.c));loc=JSON.parse(new TextDecoder().decode(p))||{}}}catch(e){loc={}}let locLog=loc,locSt={};if(isNutWrap(loc)){locLog=loc.log||{};locSt=loc.st||{}}const base=((D.nut&&D.nut.log)?JSON.parse(JSON.stringify(D.nut.log)):{})||{};NL=base;for(const d in locLog)NL[d]=Object.assign({},NL[d]||{},locLog[d]);const baseSt=JSON.parse(JSON.stringify(D.st||{}));ST=baseSt;for(const d in locSt)ST[d]=Object.assign({},ST[d]||{},locSt[d])}
function nTimes(p){if(p&&+p.times>0)return +p.times;const s=String((p&&(p.per||p.dose))||''),m=s.match(/1일\s*(\d+)/)||s.match(/(\d+)\s*(정|캡슐|병)/);return m?+m[1]:1}
function nVal(st,n){n=n||1;if(st=='skip')return {k:0,skip:true,done:false};if(st=='took')return {k:n,skip:false,done:true};if(typeof st=='string'&&st.includes('/'))st=+st.split('/')[0];const v=+st;if(st!=null&&st!==''&&!isNaN(v)&&v>0){const k=Math.min(n,Math.round(v));return {k,skip:false,done:k>=n}}return {k:0,skip:false,done:false}}
async function writeNut(d,id,st){if(d>NTODAY())return;if(!NL[d])NL[d]={};if(st==null||st==='')delete NL[d][id];else NL[d][id]=st;if(!Object.keys(NL[d]).length)delete NL[d];await saveNL();draw()}
async function bumpNut(d,id){const p=NPS().find(x=>x.id==id);if(!p)return;const n=nTimes(p),v=nVal((NL[d]||{})[id],n),next=v.skip?1:v.k>=n?0:v.k+1;if(next===0)clearSt(d,id);else if(v.skip||next>v.k)setStSlot(d,id,next-1,nowSlot(d));await writeNut(d,id,next===0?null:next)}
async function skipNut(d,id){const cur=(NL[d]||{})[id];if(cur!='skip')clearSt(d,id);await writeNut(d,id,cur=='skip'?null:'skip')}
async function setNut(d,id,st){if(st=='skip')return skipNut(d,id);if(st=='took'||st=='bump')return bumpNut(d,id);return writeNut(d,id,st)}
function expNL(){const t='[영양제 기록]\n'+JSON.stringify({log:NL,st:ST},null,2);navigator.clipboard.writeText(t).then(()=>alert('복사했어. 마속 채팅에 붙여 넣으면 원본 데이터에 반영해 둘게.'),()=>prompt('아래 내용을 복사해서 보내 줘',t))}

    return `<div class="xw-ug"><div class="xw-ulab ts">${esc(exUnitLab(u))}</div><div class="xw-kpis">${cards}</div></div>`;
  }).join('');
}
function exer(){if(!XD||XD>NTODAY())XD=NTODAY();mergeEX();const td=NTODAY(),days=exDays(XR),rows=exIn(days),today=EX.filter(x=>x.d==td).sort((a,b)=>EXSLOT.indexOf(a.p)-EXSLOT.indexOf(b.p)||(a.k||'').localeCompare(b.k||'','ko')),allK=exKinds(EX);const datalist=allK.map(k=>`<option value="${esc(k.k)}">`).join('');
const todayCard=`<div class="card xw"><div class="ch"><h3>오늘 한 운동</h3><span class="ts">${+td.slice(5,7)}월 ${+td.slice(8)}일</span></div>${today.length?`<ul class="xw-list">${exItems(today)}</ul>`:'<p class="ts">아직 오늘 기록이 없어요. 아래에서 추가해 줘.</p>'}</div>`;
const form=`<div class="card xw"><div class="ch"><h3>운동 추가</h3></div>
<div class="xw-form">
<div><label for="exd">날짜</label><input type="date" id="exd" value="${XD}" max="${td}"></div>
<div><label>시간대</label><input type="hidden" id="expv" value="아침"><div class="seg">${EXSLOT.map(p=>`<button type="button" class="${p=='아침'?'on':''}" onclick="exSetSeg('expv','${p}',this)">${p}</button>`).join('')}</div></div>
<div class="xw-wide"><label for="exk">종류</label><input type="text" id="exk" list="exkl" placeholder="예: 팔굽혀펴기, 러닝" autocomplete="off"><datalist id="exkl">${datalist}</datalist></div>
<div><label for="exn">횟수 또는 분</label><input type="number" id="exn" min="1" step="1" inputmode="numeric" placeholder="숫자"></div>
<div><label>단위</label><input type="hidden" id="exuv" value="개"><div class="seg"><button type="button" class="on" onclick="exSetSeg('exuv','개',this)">개</button><button type="button" onclick="exSetSeg('exuv','분',this)">분</button></div></div>
<div class="xw-wide"><label for="exm">메모 (선택)</label><input type="text" id="exm" placeholder="선택 사항"></div>
<div class="xw-wide"><button type="button" class="btn pb" onclick="addEx()">추가</button></div>
</div>
<div class="ts" style="margin-top:8px">종류는 자유롭게 적으면 되고, 새로 생기면 합계와 그래프에 자동으로 나타납니다.</div></div>`;
const kpis=exKpis(days,rows);
const range=`<div class="card xw"><div class="ch"><h3>종류별 합계</h3><div class="seg">${[7,30].map(n=>`<button type="button" class="${XR==n?'on':''}" onclick="XR=${n};draw()">최근 ${n}일</button>`).join('')}</div></div>${kpis}</div>`;
const chart=`<div class="card xw"><div class="ch"><h3>추이</h3><span class="ts">같은 단위끼리 쌓아 보여 줍니다</span></div>${exChart(days,rows)}</div>`;
const groups=[];days.slice().reverse().forEach(d=>{const a=EX.filter(x=>x.d==d).sort((x,y)=>EXSLOT.indexOf(x.p)-EXSLOT.indexOf(y.p)||(x.k||'').localeCompare(y.k||'','ko'));if(a.length)groups.push([d,a])});
const log=`<div class="card xw"><div class="ch"><h3>날짜별 기록</h3><span class="ts">최근 ${XR}일</span></div>${groups.length?groups.map(([d,a])=>`<div class="xw-day"><div class="sh">${+d.slice(5,7)}월 ${+d.slice(8)}일 (${DOW[new Date(d+'T12:00:00').getDay()]})</div><ul class="xw-list">${exItems(a)}</ul></div>`).join(''):'<p class="ts">이 기간에 아직 기록이 없어요.</p>'}<button class="btn" onclick="expEX()">기록 복사</button><div class="ts" style="margin-top:8px">복사한 내용을 마속 채팅에 붙여 넣으면 원본 데이터에 반영합니다.</div></div>`;
return todayCard+form+range+chart+log}

function isNutWrap(o){return !!(o&&typeof o==='object'&&!Array.isArray(o)&&Object.keys(o).length&&Object.keys(o).every(k=>k==='log'||k==='st'))}
function nutDirty(){try{return JSON.stringify(NL)!==JSON.stringify(((D.nut&&D.nut.log)||{}))||JSON.stringify(ST)!==JSON.stringify(D.st||{})}catch(e){return false}}
function nowHM(){const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}
function nowSlot(d){const hm=nowHM(),td=NTODAY();return (d&&d===nadd(td,-1))?'익일 '+hm:hm}
function normSt(s){s=String(s||'').trim();if(!s)return '';const next=/익일|다음날|\+1/.test(s);const m=s.match(/(\d{1,2})\s*[:시]\s*(\d{2})/);if(!m)return s;let hh=+m[1],mm=m[2],nx=next;if(hh>=24){hh-=24;nx=true}const hm=String(hh).padStart(2,'0')+':'+mm;return nx?'익일 '+hm:hm}
function stArr(d,id){return ((ST[d]||{})[id]||[]).slice()}
function setStSlot(d,id,i,val){if(!ST[d])ST[d]={};const a=(ST[d][id]||[]).slice();if(val==null||val===''){if(i==null||i<0)delete ST[d][id];else{a[i]='';while(a.length&&!a[a.length-1])a.pop();if(a.length)ST[d][id]=a;else delete ST[d][id]}}else{while(a.length<i)a.push('');a[i]=normSt(val);ST[d][id]=a}if(ST[d]&&!Object.keys(ST[d]).length)delete ST[d]}
function clearSt(d,id){if(ST[d]){delete ST[d][id];if(!Object.keys(ST[d]).length)delete ST[d]}}
function stChips(d,id,k){if(!k)return '';const a=stArr(d,id).filter(x=>x!=='');const n=Math.max(k||0,a.length);const show=(!a.length)?[]:(a.length===1&&(k||0)>1)?a:Array.from({length:n},(_,i)=>a[i]||'');if(!show.length)return `<div class="nst"><button type="button" class="ghost" onclick="event.stopPropagation();editNutTime('${d}','${id}',0)">시각 추가</button></div>`;const chips=show.map((s,i)=>{const lab=s||'시각';const cls=!s?'ghost':(/^익일/.test(s)?'next':(/^\d{2}:\d{2}$/.test(s)?'':'memo'));return `<button type="button" class="${cls}" onclick="event.stopPropagation();editNutTime('${d}','${id}',${i})">${esc(lab)}</button>`}).join('');return `<div class="nst">${chips}</div>`}

async function editNutTime(d,id,i){if(d>NTODAY())return;const cur=stArr(d,id)[i]||'';const t=prompt('먹은 시각을 적어 줘. 예: 07:16, 익일 01:19, 출근 전. 비우면 지워져.',cur);if(t==null)return;setStSlot(d,id,i,t.trim());await saveNL();draw()}
function escapeAttr(s){return esc(s).replace(/`/g,'')}

function nutCal(){const t=NTODAY(),end=new Date(t+'T12:00:00'),sun=new Date(end);sun.setDate(end.getDate()-end.getDay()-28);
let h=`<div class="ncal"><div></div>${[...DOW].map(c=>`<div class="nch ${c=='일'||c=='토'?'we':''}">${c}</div>`).join('')}`;
for(let i=0;i<35;i++){
  const dt=new Date(sun);dt.setDate(sun.getDate()+i);
  const ds=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  if(i%7==0)h+=`<div class="ncm">${dt.getDate()<=7||i==0?dt.getMonth()+1+'월':''}</div>`;
  const fut=ds>t,x=fut?null:nutDay(ds),cls=fut?'fu':x.all?'all':x.part?'part':x.none?'none':'empty';
  const lab=fut?'':x.all?'전부 먹음':x.part?`${x.tkD}/${x.exD}회`:x.none?'전부 스킵':'기록 없음';
  h+=`<div class="ncd ${cls}${ds==ND?' sel':''}${ds==t?' today':''}" ${fut?'':`data-nd="${ds}" onclick="ND='${ds}';draw()"`} title="${+ds.slice(5,7)}/${+ds.slice(8)} · ${lab}"><span>${dt.getDate()}</span></div>`;
}
h+='</div>';
return `<div class="card"><div class="ch"><h3>최근 5주</h3><span class="ts">칸을 <span class="dk">클릭하거나 마우스를 올리면</span><span class="tc">누르면</span> 그날 기록으로 이동합니다</span></div>${h}<div class="lg r"><span><i class="ncd empty" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>기록 없음</span><span><i class="ncd none" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>전부 스킵</span><span><i class="ncd part" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>일부</span><span><i class="ncd all" style="width:12px;height:12px;display:inline-block;border-radius:3px"></i>전부 먹음</span></div></div>`}

function nutTips(){const tips=(D.nut&&D.nut.tips)||[];if(!tips.length)return '';
return `<div class="card"><div class="ch"><h3>맞춤 제안</h3><span class="ts">생활 습관과 현재 제품 함량을 기준으로 정리했습니다</span></div>${tips.map(x=>`<div class="ntip"><b>${esc(x.k)}${x.tag?` ${badge(x.tag,'or')}`:''}</b><div class="ts tw" style="max-width:none">${esc(x.t)}</div></div>`).join('')}</div>`}
</script></body></html>
